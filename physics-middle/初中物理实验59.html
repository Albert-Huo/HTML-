  <script id="codex-theme-bootstrap">
    (() => {
      const themeKey = "xingnian.physics.theme";
      let theme = "dark";
      try {
        const storedTheme = localStorage.getItem(themeKey);
        if (storedTheme === "light" || storedTheme === "dark") theme = storedTheme;
      } catch (error) {
        console.warn("[theme-pilot] failed to read saved theme", error);
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
<script id="codex-physics-mode-bootstrap">

  const pending = [];
  document.documentElement.dataset.codexModeControls = "physics-middle-mode-controls-v1";
  Object.defineProperty(window, "__codexRegisterModeAdapter", {
    configurable:true,
    value(adapter) {
      if (!adapter || typeof adapter.getState !== "function") {
        throw new TypeError("[mode-controls] invalid adapter");
      }
      pending.push(adapter);
    },
  });
  Object.defineProperty(window, "__codexPendingModeAdapters", {
    configurable:true,
    value:pending,
  });
})();
</script>
  <style>
    :root {
      --bg:#1a1a1a; --ink:#fff; --card-bg:rgba(255,255,255,.08);

    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;padding:10px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
    #app{width:100%;max-width:980px;margin:0 auto 34px}
    button{font:inherit}
    button.main,button.sub{border:0;border-radius:8px;padding:8px 12px;color:#fff;background:#444;cursor:pointer;font-size:13px;font-weight:800;transition:.16s;touch-action:manipulation}
    button.main{background:#278a49}
    button:hover:not(:disabled){filter:brightness(1.13)}
    button:active:not(:disabled){transform:scale(.98)}
    button:disabled{opacity:.38;cursor:not-allowed}
    #spectrum{position:relative;width:100%;height:24px;border-radius:10px;overflow:hidden;box-shadow:0 0 15px rgba(255,255,255,.12);margin:0 0 12px;background:#050505}
    #spectrum::before{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,#ff4c4c 0%,#ff9a3d 5.5%,#f7e94c 11%,#54e86d 17%,#40e0d0 24%,#4aa3ff 31%,#8757ff 38%,#ec5cff 44%,#ff4c4c 50%,#ff9a3d 55.5%,#f7e94c 61%,#54e86d 67%,#40e0d0 74%,#4aa3ff 81%,#8757ff 88%,#ec5cff 94%,#ff4c4c 100%);background-size:200% 100%;background-repeat:repeat;filter:saturate(1.18) brightness(1.04);opacity:.96;animation:flowRainbow 8s linear infinite}
    @keyframes flowRainbow{from{background-position:0 0}to{background-position:-100% 0}}
    .task-card{width:100%;min-height:68px;background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;backdrop-filter:blur(6px)}
    .task-step{background:rgba(255,255,255,.16);border-radius:8px;padding:7px 10px;font-weight:900;white-space:nowrap}

    #stage{width:100%;height:590px;margin-top:10px;border-radius:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#081018;box-shadow:0 10px 26px rgba(0,0,0,.35);touch-action:pan-y pinch-zoom}
    .lab-area{position:absolute;inset:54px 10px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#061018;overflow:hidden}
    #labCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
    #labCanvas.dragging{cursor:grabbing}
    .hud{position:absolute;left:10px;top:10px;z-index:20;display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.52);font-size:12px}
    .tag{border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:3px 8px;font-weight:800;color:#dce9ff;background:rgba(255,255,255,.06)}
    #modeTag{border-color:rgba(61,220,151,.45)}
    .hint-lamp{position:absolute;left:10px;top:56px;z-index:22;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#ffd54f;font-size:17px;cursor:pointer;padding:0}

    @keyframes lampFlash{50%{box-shadow:0 0 22px rgba(255,100,120,.86);border-color:var(--danger)}}

    .dock{position:absolute;width:330px;border-radius:12px;border:1px solid var(--line);background:var(--panel-bg);backdrop-filter:blur(8px);box-shadow:var(--shadow);overflow:hidden;touch-action:none;z-index:30}

    .dock-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);cursor:grab;user-select:none;touch-action:none}
    .dockTitle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:#e7f0ff;white-space:nowrap}
    .iconBtn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#e8f1ff;border-radius:7px;padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
    .dock-body{padding:10px;max-height:330px;overflow:auto}
    .collapsed .dock-body{display:none}
    .controls{display:flex;gap:8px;margin:0}
    .controls button{flex:1}
    .analysis{display:none;border:1px solid rgba(91,188,255,.28);background:rgba(91,188,255,.07);color:#d9ecff;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5}

    .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ef476f;color:#fff;font-size:11px;transform:scale(0);opacity:0;transition:.15s}
    .badge.show{transform:scale(1);opacity:1;animation:badgePulse .9s ease-in-out infinite}
    @keyframes badgePulse{50%{transform:scale(1.14)}}
    table.record{width:100%;border-collapse:collapse;font-size:11px;color:#e8f1ff}
    table.record th,table.record td{border:1px solid rgba(255,255,255,.1);padding:6px;vertical-align:top;line-height:1.4;text-align:left}

    .demo-cursor{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(91,188,255,.8);box-shadow:0 0 14px rgba(91,188,255,.8);opacity:0;z-index:72;pointer-events:none;transition:opacity .15s}

      .toolbar button{min-width:0;padding:8px 5px;font-size:12px}
      .mobile-tabs{position:absolute;left:12px;right:12px;bottom:8px;z-index:44;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border:1px solid rgba(91,188,255,.24);border-radius:11px;background:rgba(9,12,16,.92);backdrop-filter:blur(10px)}

      .mobile-badge{position:absolute;top:-7px;right:14px;display:none;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ff3b30;color:#fff;font-size:11px}
      .mobile-badge.show{display:grid}
      .dock{width:calc(100% - 24px)}
      .dock.mobile-sheet{bottom:56px;border-color:rgba(91,188,255,.32);border-radius:12px 12px 0 0;background:linear-gradient(180deg,rgba(22,44,64,.97),rgba(9,21,33,.97));touch-action:auto}
      .dock.mobile-sheet .dock-header{display:none}
      .dock.mobile-sheet .dock-body{display:grid;max-height:190px;padding:8px;overflow:auto}
      .dock.mobile-sheet.collapsed{display:none}
      .sheet-close{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:rgba(255,255,255,.06);color:#e3f0ff;font-weight:900}
      .control.mobile-sheet .dock-body{grid-template-columns:minmax(0,1fr) 36px;gap:8px}
      .control.mobile-sheet .controls{grid-column:1;grid-row:1;margin:0}
      .control.mobile-sheet .sheet-close{grid-column:2;grid-row:1}
      .control.mobile-sheet .analysis{grid-column:1/-1}
      .data.mobile-sheet .dock-body{grid-template-columns:minmax(0,1fr) 36px;gap:8px}
      .data.mobile-sheet .sheet-close{grid-column:2;grid-row:1}
      .data.mobile-sheet table.record{grid-column:1/-1;display:block}
      .data.mobile-sheet table.record thead{display:none}
      .data.mobile-sheet table.record tbody{display:grid;gap:8px}
      .data.mobile-sheet table.record tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:rgba(255,255,255,.045)}

      .data.mobile-sheet table.record td::before{content:attr(data-label);color:#8fb4d8;font-size:9px;font-weight:900}
      .data.mobile-sheet table.record td:first-child{grid-column:1/-1;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:5px}
      .explanation h2{font-size:19px}
    }
  </style>

        else desktopPanels.forEach((panel) => {
          cancelPanelDrag(panel);
          cancelPanelFrames(panel);

        if (mutationObserver) mutationObserver.disconnect();
        if (positionedParentObserver) positionedParentObserver.disconnect();
        if (resizeObserver) resizeObserver.disconnect();
        if (lifecycleObserver) lifecycleObserver.disconnect();
        mutationObserver = null;
        positionedParentObserver = null;
        resizeObserver = null;
        lifecycleObserver = null;
        panelCleanupCallbacks.splice(0).reverse().forEach((cleanup) => cleanup());
        desktopPanels = [];
      };
      const installDesktopPanels = () => {
        if (panelCoordinatorInstalled) return;

            attributes:true,
            attributeFilter:["class"],

        if (resetButtons.length === 1) {

            if (!isResetIntent(resetButton)) return;
            resetDesktopPanelLayout();
            beginPanelResetTransaction();

          console.warn("[desktop-panels] expected one reset button", "resetBtn");

        if (window.__CODEX_PHYSICS_PANEL_TEST__ === true) panelCoordinatorApi.getTransactionState = panelToggleDebugSnapshot;

      };
      const isolateThemePointer = (event) => {
        if (button.contains(event.target)) event.stopPropagation();

      window.addEventListener("pointerdown", isolateThemePointer, true);
      window.addEventListener("mousedown", isolateThemePointer, true);
      window.addEventListener("touchstart", isolateThemePointer, { capture:true, passive:true });

        if (!button.contains(event.target)) return;
        event.stopPropagation();
        applyTheme(root.dataset.theme === "light" ? "dark" : "light", true);
      }, true);
      window.addEventListener("storage", (event) => {
        if (event.key === themeKey) applyTheme(event.newValue, false);

<script id="codex-physics-mode-runtime">
(() => {
  "use strict";
  const VERSION = "physics-middle-mode-controls-v1";
  const AUTO_DEMO_TIMING = Object.freeze({
    cursorPress:220,
    panelReveal:180,
    buttonAim:360,
    dragSoft:720,
    actionMotion:820,
    selectFast:320,
    selectCompare:560,
    observePrimary:780,
    observeSecondary:760,
    observeComparison:700,
    recordConfirm:420,
    stepTransition:460,
    analysisLead:620,
    actionSettle:120,
  });
  const pending = window.__codexPendingModeAdapters;
  delete window.__codexPendingModeAdapters;
  delete window.__codexRegisterModeAdapter;
  if (!Array.isArray(pending) || pending.length !== 1) {
    throw new Error(`[mode-controls] expected one adapter, received ${pending?.length ?? 0}`);
  }
  const adapter = pending[0];
  const requiredMethods = [
    "getState",
    "bindController",
    "startDemo",
    "cancelDemo",
    "resetChallenge",
    "setFreeMode",
    "captureFreeEntry",
    "restoreFreeEntry",
  ];
  for (const method of requiredMethods) {
    if (typeof adapter[method] !== "function") {
      throw new TypeError(`[mode-controls] adapter is missing ${method}()`);
    }
  }
  const state = adapter.getState();
  if (!state || typeof state !== "object") {
    throw new TypeError("[mode-controls] adapter state must be an object");
  }
  const resetBtn = document.getElementById("resetBtn");
  const autoDemoBtn = document.getElementById("autoDemoBtn");
  const freeBtn = document.getElementById("freeBtn");
  const taskCard = document.getElementById("taskCard");
  const modeTag = document.getElementById("modeTag") || document.getElementById("modeChip");
  const statusTag = document.getElementById("statusTag") || document.getElementById("stateChip");
  if (!resetBtn || !autoDemoBtn || !freeBtn || !taskCard || !modeTag || !statusTag) {
    throw new Error("[mode-controls] required mode-control DOM is missing");
  }

  let generation = 0;
  let freeEntry = null;
  let demoCompletedPresentation = false;
  let pauseStartedAt = 0;
  let pausedDuration = 0;
  const rawSleep = (milliseconds) =>
    new Promise((resolve) => setTimeout(resolve, milliseconds));
  const currentRunId = () => generation;
  const activeNow = () => {
    const now = performance.now();
    const activePause = pauseStartedAt ? now - pauseStartedAt : 0;
    return now - pausedDuration - activePause;
  };
  const assertCurrent = (runId) => {
    if (runId !== generation) {
      const error = new Error("MODE_CONTROL_CANCELLED");
      error.code = "MODE_CONTROL_CANCELLED";
      throw error;
    }
  };
  const wait = async (milliseconds, phase, runId) => {
    const requested = Math.max(Number(milliseconds) || 0, 0);
    const phaseFloor = phase ? AUTO_DEMO_TIMING[phase] : 0;
    if (phase && !Number.isFinite(phaseFloor)) {
      throw new RangeError(`[mode-controls] unknown timing phase ${phase}`);
    }
    let remaining = Math.max(requested, phaseFloor || 0);
    while (remaining > 0) {
      assertCurrent(runId);
      if (state.autoPaused) {
        await rawSleep(16);
        continue;
      }
      const slice = Math.min(remaining, 16);
      await rawSleep(slice);
      assertCurrent(runId);
      if (!state.autoPaused) remaining -= slice;
    }
  };

  const setText = (element, value) => {
    if (element.textContent !== value) element.textContent = value;
  };
  const setDisabled = (element, value) => {
    if (element.disabled !== value) element.disabled = value;
  };
  const setLabel = (element, prefix, value) => setText(element, `${prefix}${value}`);
  const syncControls = () => {
    const playing = Boolean(state.autoPlaying);
    const paused = playing && Boolean(state.autoPaused);
    const free = Boolean(state.freeMode);
    setText(resetBtn, playing
      ? (paused ? "继续演示" : "暂停演示")
      : (free ? "重置操作" : "重置关卡"));
    setText(autoDemoBtn, playing ? "退出演示" : "演示模式");
    setText(freeBtn, free ? "退出自由模式" : "自由模式");
    setDisabled(autoDemoBtn, free && !playing);
    setDisabled(freeBtn, playing);
    setDisabled(resetBtn, false);
    const pressed = paused ? "true" : "false";
    if (resetBtn.getAttribute("aria-pressed") !== pressed) {
      resetBtn.setAttribute("aria-pressed", pressed);
    }
    taskCard.classList.toggle("free-mode", free);
  };
  const syncModeLabels = (completed = false) => {
    if (state.autoPlaying) {
      setLabel(
        modeTag,
        "模式：",
        state.autoPaused ? "演示模式 · 已暂停" : "演示模式 · 自动运行",
      );
      setLabel(statusTag, "状态：", state.autoPaused ? "演示已暂停" : "演示中");
      return;
    }
    if (state.freeMode) {
      setLabel(modeTag, "模式：", "自由模式 · 自主探索");
      setLabel(statusTag, "状态：", "自由探索");
      return;
    }
    if (completed) {
      setLabel(modeTag, "模式：", "演示模式 · 演示完成");
      setLabel(statusTag, "状态：", "已完成");
      return;
    }
    const idleMode = adapter.getIdleModeLabel?.();
    const idleStatus = adapter.getIdleStatusLabel?.();
    if (idleMode) setLabel(modeTag, "模式：", idleMode);
    if (idleStatus) setLabel(statusTag, "状态：", idleStatus);
  };
  const refresh = () => {
    if (typeof adapter.refreshView === "function") adapter.refreshView();
  };

  const beginDemo = async () => {
    if (state.freeMode || state.autoPlaying) return;
    const runId = ++generation;
    demoCompletedPresentation = false;
    pauseStartedAt = 0;
    pausedDuration = 0;
    state.autoPaused = false;
    let run;
    try {
      run = Promise.resolve(adapter.startDemo());
    } catch (error) {
      state.autoPlaying = false;
      state.autoPaused = false;
      syncControls();
      throw error;
    }
    if (!state.autoPlaying) state.autoPlaying = true;
    syncControls();
    syncModeLabels(false);
    try {
      await run;
    } catch (error) {
      if (runId !== generation || error?.code === "MODE_CONTROL_CANCELLED") return;
      throw error;
    } finally {
      if (runId !== generation) return;
      state.autoPlaying = false;
      state.autoPaused = false;
      pauseStartedAt = 0;
      demoCompletedPresentation = Boolean(adapter.isDemoCompleted?.() ?? state.demoCompleted);
      refresh();
      syncControls();
      syncModeLabels(demoCompletedPresentation);
    }
  };
  const togglePause = () => {
    if (!state.autoPlaying) return;
    if (!state.autoPaused) {
      state.autoPaused = true;
      pauseStartedAt = performance.now();
      adapter.pauseApparatus?.();
    } else {
      const now = performance.now();
      if (pauseStartedAt) pausedDuration += now - pauseStartedAt;
      pauseStartedAt = 0;
      state.autoPaused = false;
      adapter.resumeApparatus?.();
    }
    syncControls();
    syncModeLabels(false);
  };
  const exitDemo = () => {
    if (!state.autoPlaying) return;
    generation += 1;
    adapter.cancelDemo();
    state.autoPlaying = false;
    state.autoPaused = false;
    state.freeMode = false;
    pauseStartedAt = 0;
    pausedDuration = 0;
    demoCompletedPresentation = false;
    adapter.resetChallenge();
    refresh();
    syncControls();
    syncModeLabels(false);
  };
  const toggleFree = () => {
    if (state.autoPlaying) return;
    if (!state.freeMode) {
      demoCompletedPresentation = false;
      freeEntry = adapter.captureFreeEntry();
      adapter.setFreeMode(true);
      state.freeMode = true;
    } else {
      adapter.setFreeMode(false);
      state.freeMode = false;
      freeEntry = null;
    }
    refresh();
    syncControls();
    syncModeLabels(false);
  };
  const resetIntent = () => {
    if (state.autoPlaying) {
      togglePause();
      return;
    }
    if (state.freeMode) {
      if (freeEntry === null) {
        throw new Error("[mode-controls] free-mode entry snapshot is missing");
      }
      adapter.restoreFreeEntry(freeEntry);
      state.freeMode = true;
    } else {
      generation += 1;
      demoCompletedPresentation = false;
      adapter.resetChallenge();
      state.autoPlaying = false;
      state.autoPaused = false;
      state.freeMode = false;
    }
    refresh();
    syncControls();
    syncModeLabels(false);
  };

  const controller = Object.freeze({
    currentRunId,
    now:activeNow,
    timing:AUTO_DEMO_TIMING,
    wait,
  });
  adapter.bindController(controller);
  const onModeControlClick = (event) => {
    const button = event.target.closest("button");
    if (![resetBtn, autoDemoBtn, freeBtn].includes(button)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (button === resetBtn) resetIntent();
    else if (button === freeBtn) toggleFree();
    else if (state.autoPlaying) exitDemo();
    else void beginDemo();
  };
  for (const button of [resetBtn, autoDemoBtn, freeBtn]) {
    button.addEventListener("click", onModeControlClick, true);
  }

  let ownershipSyncQueued = false;
  const ownershipObserver = new MutationObserver(() => {
    if (ownershipSyncQueued) return;
    ownershipSyncQueued = true;
    queueMicrotask(() => {
      ownershipSyncQueued = false;
      syncControls();
      syncModeLabels(demoCompletedPresentation);
    });
  });
  for (const element of [resetBtn, autoDemoBtn, freeBtn, modeTag, statusTag]) {
    ownershipObserver.observe(element, {
      attributes:true,
      attributeFilter:["disabled", "aria-pressed"],
      childList:true,
      subtree:true,
    });
  }

  Object.defineProperty(window, "__codexModeControls", {
    configurable:true,
    value:Object.freeze({ version:VERSION }),
  });
  if (window.__CODEX_MODE_CONTROLS_TEST__ === true) {
    Object.defineProperty(window, "__codexModeControlsDebug", {
      configurable:true,
      value:Object.freeze({
        snapshot:() => Object.freeze({
          generation,
          freeEntry:Boolean(freeEntry),
          playing:Boolean(state.autoPlaying),
          paused:Boolean(state.autoPaused),
          free:Boolean(state.freeMode),
        }),
      }),
    });
  }
  delete window.__CODEX_MODE_CONTROLS_TEST__;
  syncControls();
  syncModeLabels(false);
})();
</script>
