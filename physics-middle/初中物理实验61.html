    (() => {
      const themeKey = "xingnian.physics.theme";
      let theme = "dark";
      try {
        const storedTheme = localStorage.getItem(themeKey);
        if (storedTheme === "light" || storedTheme === "dark") theme = storedTheme;
      } catch (error) {
        console.warn("[theme-pilot] failed to read saved theme", error);
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

    configurable:true,

      }
      pending.push(adapter);

  });

    configurable:true,

  });
})();

          <button class="sheet-close" id="dataSheetCloseBtn" type="button" aria-label="收起数据面板"><svg class="sheet-close-icon" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1 L6 6 L11 1"/></svg></button>

    </main>
    <div class="toolbar"><button class="sub" id="resetBtn" type="button">重置关卡</button><button class="sub" id="autoDemoBtn" type="button">演示模式</button><button class="sub" id="freeBtn" type="button">自由模式</button></div>
    <div class="modal-mask" id="doneMask"><div class="modal"><h3>实验完成</h3><p>电流表要串联接入电路，使电流从正接线柱流入、负接线柱流出，并先看量程和分度值再读数。同一串联电路中，电流表放在甲、乙两处的示数相同。</p><button class="main ok" id="okBtn" type="button">OK</button></div></div>
    <section class="explanation">
      <h2>实验名：用电流表测量电流</h2>
      <p>断开开关完成串联接线，无法预估电流时先用 3 A 量程快速试触，再选择合适量程读数。</p>
      <p>读数前先确认量程和分度值；同一串联电路中，电流表放在不同位置测得的电流相同。</p>

  </div>
  <script>
  (() => {
    "use strict";
    const $ = selector => document.querySelector(selector);
    const stage=$("#stage"),labArea=$("#labArea"),canvas=$("#labCanvas"),ctx=canvas.getContext("2d");
    const taskStep=$("#taskStep"),taskText=$("#taskText"),taskHint=$("#taskHint"),dots=$("#dots"),modeTag=$("#modeTag"),statusTag=$("#statusTag");
    const hintLamp=$("#hintLamp"),hintPop=$("#hintPop"),controlDock=$("#controlDock"),dataDock=$("#dataDock"),controlToggleBtn=$("#controlToggleBtn"),dataToggleBtn=$("#dataToggleBtn");
    const recordBtn=$("#recordBtn"),analyzeBtn=$("#analyzeBtn"),analysisText=$("#analysisText"),recordBody=$("#recordBody"),emptyRecords=$("#emptyRecords"),dataNotice=$("#dataNotice");
    const resetBtn=$("#resetBtn"),autoDemoBtn=$("#autoDemoBtn"),freeBtn=$("#freeBtn"),toast=$("#toast"),checkmark=$("#checkmark"),doneMask=$("#doneMask"),okBtn=$("#okBtn"),demoCursor=$("#demoCursor");
    const experimentTab=$("#experimentTab"),dataTab=$("#dataTab"),dataTabBadge=$("#dataTabBadge"),controlSheetCloseBtn=$("#controlSheetCloseBtn"),dataSheetCloseBtn=$("#dataSheetCloseBtn");
    const CURRENT=0.36, TASKS=[
      {text:"在位置甲串联接入电流表",hint:"保持开关断开，把红色线头接 3 A，蓝色线头接负接线柱。",detail:"拖动两个发光线头到电流表接线柱。无法预估电流时，先选较大的 3 A 量程。",check:()=>correctConnection("3")},
      {text:"用 3 A 量程快速试触",hint:"点击开关短暂通电，观察指针偏转后实验台会自动断开。",detail:"试触只需短暂闭合。若指针偏转较小，应断电后改用较小量程。",check:()=>state.trialObserved},
      {text:"改用 0.6 A 量程，测量位置甲",hint:"拖动红线改接 0.6 A，闭合开关并点击“记录本次”。",detail:"0.6 A 量程的分度值为 0.02 A。先看量程、再看分度值，最后读指针。",check:()=>hasRecord("甲")},
      {text:"把电流表移到位置乙再次测量",hint:"先断开开关，拖动电流表到乙，再闭合并记录。",detail:"保持同一串联电路不变，只改变电流表的位置，比较甲、乙两次示数。",check:()=>hasRecord("乙")&&state.meterMoved},
      {text:"比较两次示数并归纳规则",hint:"打开实验面板，点击“分析结论”。",detail:"比较甲、乙位置的示数，再归纳电流表的连接、量程和读数规则。",check:()=>state.analysisDone}
    ];
    let codexModeController = null; /* codex-physics-mode-source:continuous-controller */
    const state={
      currentTask:0,completed:false,freeMode:false,autoPlaying:false,autoCancel:false,autoRunId:0,
      width:0,height:0,stageWidth:0,stageHeight:0,layout:null,drag:null,drawerDrag:null,
      wires:{red:{terminal:null,preview:null,touched:false},blue:{terminal:null,preview:null,touched:false}},
      switchClosed:false,trialObserved:false,meterPosition:"甲",meterMoved:false,records:[],unseenRecords:0,
      analysisDone:false,stepWarning:false,timers:new Set(),phase:0
    };
    const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
    /* codex-physics-mode-source:continuous-wait-61:start */
    const rawModeSleep=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
    async function sleep(ms,phase=null){
      if(!codexModeController||!state.autoPlaying)return rawModeSleep(ms);
      try{return await codexModeController.wait(ms,phase,codexModeController.currentRunId());}
      catch(error){if(error?.code==="MODE_CONTROL_CANCELLED")throw new Error("AUTO_CANCELLED");throw error;}
    }
    /* codex-physics-mode-source:continuous-wait-61:end */
    function schedule(fn,ms){const id=setTimeout(()=>{state.timers.delete(id);fn();},ms);state.timers.add(id);return id}
    function clearTimers(){for(const id of state.timers)clearTimeout(id);state.timers.clear()}
    function pointIn(p,b){return p&&b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}
    function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
    function currentRange(){const terminals=[state.wires.red.terminal,state.wires.blue.terminal];return terminals.includes("pos06")?"0.6":terminals.includes("pos3")?"3":null}
    function polarity(){if(state.wires.red.terminal==="neg"&&["pos06","pos3"].includes(state.wires.blue.terminal))return"reverse";if(state.wires.blue.terminal==="neg"&&["pos06","pos3"].includes(state.wires.red.terminal))return"correct";return"incomplete"}
    function correctConnection(range){return polarity()==="correct"&&currentRange()===range&&state.wires.red.touched&&state.wires.blue.touched}
    function hasRecord(position){return state.records.some(record=>record.position===position)}
    function reading(){if(!state.switchClosed||polarity()==="incomplete")return 0;return polarity()==="reverse"?-CURRENT:CURRENT}
    function division(){return currentRange()==="0.6"?0.02:0.1}
    function displayReading(){if(!state.switchClosed)return 0;return currentRange()==="0.6"?CURRENT:Math.round(CURRENT*10)/10}
    function setModeLabel(){modeTag.textContent="模式："+(state.autoPlaying?"演示模式 · 自动运行":state.freeMode?"自由模式 · 自主探索":state.completed?"闯关模式 · 已通关":"闯关模式 · 关卡 "+(state.currentTask+1)+"/"+TASKS.length)}
    function updateStatus(text){
      if(text){statusTag.textContent="状态："+text;return}
      if(state.completed)statusTag.textContent="状态：实验完成";
      else if(state.autoPlaying)statusTag.textContent="状态：自动演示中";
      else if(state.switchClosed&&polarity()==="correct")statusTag.textContent="状态：通电 · "+displayReading().toFixed(currentRange()==="0.6"?2:1)+" A";
      else if(state.switchClosed&&polarity()==="reverse")statusTag.textContent="状态：接线柱接反";
      else if(polarity()==="reverse")statusTag.textContent="状态：接线柱接反，开关已断开";
      else if(polarity()==="correct")statusTag.textContent="状态：接线完成，开关断开";
      else statusTag.textContent="状态：等待接线";
    }
    function initDots(){dots.innerHTML=TASKS.map(()=>'<span class="dot"></span>').join("")}
    function updateDots(){[...dots.children].forEach((dot,index)=>{dot.className="dot";if(state.completed||index<state.currentTask)dot.classList.add("done");else if(index===state.currentTask)dot.classList.add(state.stepWarning?"warn":"active")})}
    function setStep(index){state.currentTask=clamp(index,0,TASKS.length-1);state.stepWarning=false;const task=TASKS[state.currentTask];taskStep.textContent="关卡 "+(state.currentTask+1)+" / "+TASKS.length;taskText.textContent=task.text;taskHint.textContent=task.hint;hintPop.textContent=task.detail;setModeLabel();updateDots();updateStatus();draw()}
    function showToast(message){toast.textContent=message;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),1600)}
    function showCheck(){checkmark.classList.add("active");clearTimeout(showCheck.timer);showCheck.timer=setTimeout(()=>checkmark.classList.remove("active"),520)}
    function warn(message){state.stepWarning=true;updateDots();hintLamp.classList.remove("flash");void hintLamp.offsetWidth;hintLamp.classList.add("flash");showToast(message);schedule(()=>{state.stepWarning=false;updateDots()},1250)}
    function passStepIfReady({quiet=false}={}){
      if(state.freeMode||state.completed)return false;
      if(!TASKS[state.currentTask].check()){if(!quiet)warn("当前关卡的操作证据还不完整。");return false}
      showCheck();
      if(state.currentTask===TASKS.length-1){state.completed=true;doneMask.style.display="flex";setModeLabel();updateStatus();updateDots()}
      else setStep(state.currentTask+1);
      return true
    }
    function setDrawerCollapsed(drawer,collapsed){
      drawer.classList.toggle("collapsed",collapsed);
      (drawer===controlDock?controlToggleBtn:dataToggleBtn).textContent=collapsed?"展开":"收起";
      if(drawer===dataDock&&!collapsed){state.unseenRecords=0;updateBadge()}
      syncPanels()
    }
    function isMobile(){return(state.stageWidth||stage.clientWidth)<=720}
    function syncPanels(){
      const mobile=isMobile();controlDock.classList.toggle("mobile-sheet",mobile);dataDock.classList.toggle("mobile-sheet",mobile);
      if(mobile){controlDock.style.left="12px";controlDock.style.top="";dataDock.style.left="12px";dataDock.style.top=""}
      else{
        if(!controlDock.dataset.moved){controlDock.style.left=Math.max(12,state.stageWidth-controlDock.offsetWidth-12)+"px";controlDock.style.top="58px"}
        if(!dataDock.dataset.moved){dataDock.style.left=Math.max(12,state.stageWidth-dataDock.offsetWidth-12)+"px";dataDock.style.top=(controlDock.offsetTop+controlDock.offsetHeight+8)+"px"}
      }
      experimentTab.classList.toggle("active",mobile&&!controlDock.classList.contains("collapsed"));
      dataTab.classList.toggle("active",mobile&&!dataDock.classList.contains("collapsed"))
    }
    function bindDrawer(drawer){
      const header=drawer.querySelector("[data-drag-handle]");
      header.addEventListener("pointerdown",event=>{if(isMobile()||event.target.closest("button"))return;const rect=drawer.getBoundingClientRect(),parent=stage.getBoundingClientRect();state.drawerDrag={drawer,dx:event.clientX-rect.left,dy:event.clientY-rect.top,parent};drawer.dataset.moved="1";header.setPointerCapture(event.pointerId);event.preventDefault()});
      header.addEventListener("pointermove",event=>{if(!state.drawerDrag||state.drawerDrag.drawer!==drawer)return;const d=state.drawerDrag,x=clamp(event.clientX-d.parent.left-d.dx,6,d.parent.width-drawer.offsetWidth-6),y=clamp(event.clientY-d.parent.top-d.dy,6,d.parent.height-drawer.offsetHeight-6);drawer.style.left=x+"px";drawer.style.top=y+"px";event.preventDefault()});
      header.addEventListener("pointerup",event=>{state.drawerDrag=null;try{header.releasePointerCapture(event.pointerId)}catch(error){console.warn("释放面板拖动失败",error)}})
    }
    function updateBadge(){dataNotice.textContent=String(state.unseenRecords);const show=state.unseenRecords>0&&dataDock.classList.contains("collapsed");dataNotice.classList.toggle("show",show&&!isMobile());dataTabBadge.textContent=String(state.unseenRecords);dataTabBadge.classList.toggle("show",show&&isMobile())}
    function renderRecords(){
      recordBody.innerHTML="";
      state.records.forEach(record=>{const row=document.createElement("tr");const labels=["位置","量程","分度值","示数"];[record.position,record.range+" A",record.division.toFixed(2)+" A",record.value.toFixed(2)+" A"].forEach((value,index)=>{const cell=document.createElement("td");cell.textContent=value;cell.dataset.label=labels[index];row.appendChild(cell)});recordBody.appendChild(row)});
      emptyRecords.style.display=state.records.length?"none":"block"
    }
    function recordObservation({auto=false}={}){
      if(!state.switchClosed){warn("请先闭合开关，待指针稳定后再记录。");return false}
      if(polarity()!=="correct"){warn("电流必须从正接线柱流入、负接线柱流出。");return false}
      const range=currentRange();
      if(!state.freeMode&&state.currentTask===1&&range!=="3"){warn("试触阶段应使用 3 A 大量程。");return false}
      if(!state.freeMode&&state.currentTask===2&&!(range==="0.6"&&state.meterPosition==="甲")){warn("请用 0.6 A 量程测量位置甲。");return false}
      if(!state.freeMode&&state.currentTask===3&&!(range==="0.6"&&state.meterPosition==="乙")){warn("请把电流表移到位置乙后再记录。");return false}
      const position=state.meterPosition,key=position+"-"+range;
      if(!state.records.some(record=>record.key===key)){
        state.records.push({key,position,range,division:division(),value:range==="0.6"?CURRENT:Math.round(CURRENT*10)/10});
        if(dataDock.classList.contains("collapsed")){state.unseenRecords+=1;updateBadge()}
        renderRecords();showToast("已记录位置"+position+"："+displayReading().toFixed(range==="0.6"?2:1)+" A")
      }else if(!auto)showToast("这组读数已经记录过");
      if(!state.freeMode&&state.currentTask===3&&position==="乙"){
        state.switchClosed=false;
        updateStatus("位置乙已记录，开关已断开");
        draw()
      }
      passStepIfReady({quiet:true});return true
    }
    function analyzeConclusion(){
      if(!hasRecord("甲")||!hasRecord("乙")){warn("请先完成甲、乙两个位置的测量。");return false}
      state.analysisDone=true;analysisText.classList.add("ok");analysisText.textContent="甲、乙两处均为 0.36 A：同一串联电路中电流处处相等。电流表应串联、正进负出，并先看量程和分度值。";showToast("已归纳实验结论");passStepIfReady({quiet:true});return true
    }
    function toggleSwitch(mark=true){
      if(state.autoPlaying&&!mark)return false;
      if(state.switchClosed){state.switchClosed=false;updateStatus();draw();showToast("开关已断开");return true}
      if(polarity()==="incomplete"){warn("电流表接线尚未完成，不能闭合开关。");return false}
      state.switchClosed=true;
      if(polarity()==="reverse"){
        updateStatus();draw();warn("接线柱接反，指针反偏！已自动断开。");
        schedule(()=>{state.switchClosed=false;updateStatus();draw()},760);return false
      }
      if(!state.freeMode&&state.currentTask===0&&!correctConnection("3")){state.switchClosed=false;warn("先在断电状态用 3 A 和负接线柱完成接线。");return false}
      if(currentRange()==="3"&&!state.trialObserved){
        updateStatus("3 A 量程试触：偏转较小");
        schedule(()=>{state.switchClosed=false;state.trialObserved=true;updateStatus("试触完成，已自动断开");draw();passStepIfReady({quiet:true})},950)
      }else updateStatus();
      draw();passStepIfReady({quiet:true});return true
    }
    function freshWires(){state.wires={red:{terminal:null,preview:null,touched:false},blue:{terminal:null,preview:null,touched:false}}}
    function geometry(){
      const w=state.width,h=state.height,mobile=w<620,s=Math.min(w/(mobile?650:920),h/(mobile?550:560));
      const bw=(mobile?630:860)*s,bh=(mobile?530:500)*s,x=(w-bw)/2,y=Math.max(8,(h-bh)/2);
      const meterCx=x+(state.meterPosition==="甲"?(mobile?300:430):(mobile?465:620))*s,meterCy=y+(mobile?290:300)*s;
      const terminals={neg:{x:meterCx-92*s,y:meterCy+92*s},pos06:{x:meterCx,y:meterCy+92*s},pos3:{x:meterCx+92*s,y:meterCy+92*s}};
      const battery={x:x+(mobile?20:55)*s,y:y+(mobile?390:344)*s};
      const switchBox={x:x+(mobile?45:170)*s,y:y+(mobile?80:93)*s,w:135*s,h:70*s};
      const bulb={x:x+(mobile?515:718)*s,y:y+(mobile?95:128)*s};
      const componentTerminals={
        batteryNeg:{x:battery.x-3*s,y:battery.y+39*s},
        batteryPos:{x:battery.x+137*s,y:battery.y+39*s},
        switchLeft:{x:switchBox.x+24*s,y:switchBox.y+39*s},
        switchRight:{x:switchBox.x+111*s,y:switchBox.y+39*s},
        bulbLeft:{x:bulb.x-58*s,y:bulb.y+58*s},
        bulbRight:{x:bulb.x+58*s,y:bulb.y+58*s}
      };
      const sources=state.meterPosition==="甲"
        ?{red:componentTerminals.switchRight,blue:componentTerminals.bulbRight}
        :{red:componentTerminals.bulbRight,blue:componentTerminals.batteryNeg};
      const slots={甲:{x:x+(mobile?300:430)*s,y:y+(mobile?470:460)*s},乙:{x:x+(mobile?465:620)*s,y:y+(mobile?470:460)*s}};
      return{mobile,s,x,y,bw,bh,meterCx,meterCy,terminals,sources,battery,bulb,componentTerminals,meterBody:{x:meterCx-150*s,y:meterCy-112*s,w:300*s,h:205*s},switch:switchBox,switchHit:{x:switchBox.x-14*s,y:switchBox.y-14*s,w:switchBox.w+28*s,h:switchBox.h+28*s},slots}
    }
    function canvasPoint(event){const rect=canvas.getBoundingClientRect();return{x:event.clientX-rect.left,y:event.clientY-rect.top}}
    function wireEnd(name){const wire=state.wires[name],g=state.layout;if(wire.preview)return wire.preview;if(wire.terminal)return g.terminals[wire.terminal];return g.sources[name]}
    function nearestTerminal(point){
      const entries=Object.entries(state.layout.terminals).map(([id,p])=>({id,p,d:distance(point,p)})).sort((a,b)=>a.d-b.d);
      return entries[0]&&entries[0].d<=Math.max(30,34*state.layout.s)?entries[0].id:null
    }
    function finishWire(name,point){
      const wire=state.wires[name],target=nearestTerminal(point),other=state.wires[name==="red"?"blue":"red"];
      wire.preview=null;wire.terminal=target&&target!==other.terminal?target:null;wire.touched=true;state.drag=null;
      if(target&&target===other.terminal)warn("两个线头不能接在同一个接线柱上。");
      updateStatus();draw();passStepIfReady({quiet:true});return!!wire.terminal
    }
    function moveMeter(point){
      const g=state.layout,target=Math.abs(point.x-g.slots.甲.x)<=Math.abs(point.x-g.slots.乙.x)?"甲":"乙";
      if(target!==state.meterPosition){state.meterPosition=target;state.meterMoved=true;state.layout=geometry();updateStatus("电流表已移到位置"+target);draw()}
    }
    function onPointerDown(event){
      if(state.autoPlaying)return;const point=canvasPoint(event),g=state.layout;
      for(const name of["red","blue"]){if(distance(point,wireEnd(name))<=Math.max(24,28*g.s)){if(state.switchClosed){warn("换接导线前必须先断开开关。");return}state.drag={type:"wire",name};state.wires[name].terminal=null;state.wires[name].preview=point;canvas.setPointerCapture(event.pointerId);draw();event.preventDefault();return}}
      if(pointIn(point,g.switchHit)){toggleSwitch();event.preventDefault();return}
      if(pointIn(point,g.meterBody)){if(state.switchClosed){warn("移动电流表前必须先断开开关。");return}state.drag={type:"meter"};canvas.setPointerCapture(event.pointerId);event.preventDefault();return}
      showToast("拖动线头接线、点击开关，或断电后拖动电流表。")
    }
    function onPointerMove(event){
      if(!state.drag)return;const point=canvasPoint(event);
      if(state.drag.type==="wire")state.wires[state.drag.name].preview=point;else moveMeter(point);
      draw();event.preventDefault()
    }
    function onPointerUp(event){
      if(!state.drag)return;const drag=state.drag,point=canvasPoint(event);
      if(drag.type==="wire")finishWire(drag.name,point);else{moveMeter(point);state.drag=null;passStepIfReady({quiet:true})}
      try{canvas.releasePointerCapture(event.pointerId)}catch(error){console.warn("释放实验台指针失败",error)}
      event.preventDefault()
    }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    function box(x,y,w,h,r,color,stroke){ctx.save();roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}ctx.restore()}
    function text(value,x,y,size=13,color="#eaf5ff",align="center",weight=800){ctx.save();ctx.fillStyle=color;ctx.font=weight+" "+Math.max(9,size)+"px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(value,x,y);ctx.restore()}
    function line(points,color,width=4,dash=[]){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";ctx.setLineDash(dash);ctx.beginPath();points.forEach((p,index)=>index?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore()}
    function curve(from,to,color,width=5,bend=34){
      ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(from.x,from.y);const mid=(from.y+to.y)/2+bend;ctx.bezierCurveTo(from.x,mid,to.x,mid,to.x,to.y);ctx.stroke();ctx.restore()

<script id="codex-physics-mode-runtime">
(() => {
  "use strict";
  const VERSION = "physics-middle-mode-controls-v1";
  const AUTO_DEMO_TIMING = Object.freeze({
    cursorPress:220,
    panelReveal:180,
    buttonAim:360,
    dragSoft:720,
    actionMotion:820,
    selectFast:320,
    selectCompare:560,
    observePrimary:780,
    observeSecondary:760,
    observeComparison:700,
    recordConfirm:420,
    stepTransition:460,

  delete window.__codexPendingModeAdapters;

  }
  const adapter = pending[0];
  const requiredMethods = [
    "getState",
    "bindController",
    "startDemo",
    "cancelDemo",
    "resetChallenge",
    "setFreeMode",
    "captureFreeEntry",
    "restoreFreeEntry",

    }

    throw new TypeError("[mode-controls] adapter state must be an object");
  }
  const resetBtn = document.getElementById("resetBtn");
  const autoDemoBtn = document.getElementById("autoDemoBtn");
  const freeBtn = document.getElementById("freeBtn");
  const taskCard = document.getElementById("taskCard");
  const modeTag = document.getElementById("modeTag") || document.getElementById("modeChip");
  const statusTag = document.getElementById("statusTag") || document.getElementById("stateChip");

  let pauseStartedAt = 0;
  let pausedDuration = 0;

    const requested = Math.max(Number(milliseconds) || 0, 0);
    const phaseFloor = phase ? AUTO_DEMO_TIMING[phase] : 0;

      throw new RangeError(`[mode-controls] unknown timing phase ${phase}`);

        await rawSleep(16);

  const syncControls = () => {
    const playing = Boolean(state.autoPlaying);
    const paused = playing && Boolean(state.autoPaused);
    const free = Boolean(state.freeMode);
    setText(resetBtn, playing

      : (free ? "重置操作" : "重置关卡"));

        state.autoPaused ? "演示模式 · 已暂停" : "演示模式 · 自动运行",

      return;

    if (state.freeMode) {
      setLabel(modeTag, "模式：", "自由模式 · 自主探索");
      setLabel(statusTag, "状态：", "自由探索");

  };

    currentRunId,
    now:activeNow,
    timing:AUTO_DEMO_TIMING,

      subtree:true,

  });
