    <section class="explanation"><h2>实验名：摩擦绳使金属筒升温</h2><p><b>关键操作与现象：</b>握住绳柄做足够行程的水平往复运动；摩擦路程和机械功逐步增加，温度贴与温度计显示金属筒连续升温。停止后温度缓慢回落。</p><p><b>结论：</b>克服摩擦力对金属筒做功，机械能转化为金属筒的内能。</p></section>

      width:0,height:0,stageWidth:0,stageHeight:0,ropeOffset:0,ropeVelocity:0,directionChanges:0,frictionDistance:0,mechanicalWork:0,

    function speedText(run=state.lastRun){const step=run?.step??state.currentTask,kind=qualifyTrialSpeed(run,step);if(state.freeMode)return kind==="fast"?"快速":kind==="slow"?"慢速":"未形成往复";return kind==="fast"?(step===0?"速度偏快":"快速合格"):kind==="slow"?(step===1?"速度偏慢":"慢速合格"):kind==="cumulative"?"追加合格":"未形成往复";}

    function showToast(message){toast.textContent=message;toast.classList.add("show");if(showToast.id){clearTimeout(showToast.id);state.uiTimers.delete(showToast.id);}showToast.id=scheduleUi(()=>toast.classList.remove("show"),1500);}
    function showCheck(){checkmark.classList.add("active");if(showCheck.id){clearTimeout(showCheck.id);state.uiTimers.delete(showCheck.id);}showCheck.id=scheduleUi(()=>checkmark.classList.remove("active"),560);}
    function warnStep(message){state.stepWarning=true;updateDots();hintLamp.classList.remove("flash");void hintLamp.offsetWidth;hintLamp.classList.add("flash");showToast(message);scheduleUi(()=>{state.stepWarning=false;updateDots();},1200);}
    function layout(){
      const mobile=state.width<600,s=Math.min(state.width/(mobile?760:980),state.height/510),x=mobile?(state.width-740*s)/2:24*s,y=Math.max(34,(state.height-485*s)/2);

      const offsetBounds={min:Math.max(-58,Math.max(hitSize/2-baseLeftX,hitSize/2-baseRightX)/s),max:Math.min(58,Math.min(state.width-hitSize/2-baseLeftX,state.width-hitSize/2-baseRightX)/s)};

    }
    function box(center,size=48){return{x:center.x-size/2,y:center.y-size/2,width:size,height:size};}
    function apparatusGeometry(){const g=layout();return{apparatus:{...g.apparatus},cylinder:{...g.cylinder},ropeContact:{...g.ropeContact},leftHandle:box(g.leftCenter,g.hitSize),rightHandle:box(g.rightCenter,g.hitSize),thermometer:{...g.thermometer},readout:{...g.readout}};}
    function syncHandleLayers(){if(!state.width)return;const geometry=apparatusGeometry();[[leftHandleHit,geometry.leftHandle],[rightHandleHit,geometry.rightHandle]].forEach(([element,roi])=>{element.style.left=roi.x+"px";element.style.top=roi.y+"px";element.style.width=roi.width+"px";element.style.height=roi.height+"px";});}
    function beginRun(source){

    }
    function finishRun(){

    function frame(now){/* codex-physics-mode-source:advanced-frame:start */

          return;
        }
        desktopPanels.forEach((panel) => {
          if (!applyAnchor(panel, panel.anchor)) return;
          applyPanelLayer(panel);
          syncPanel(panel);
        });
      };
      const queuePanelSync = (records = []) => {
        if (!desktopPanelMutationAllowed()) return;
        const transaction = panelToggleTransaction;
        const panelClassChanged = records.some((record) => record.type === "attributes" && record.attributeName === "class");
        if (transaction && panelClassChanged) {
          schedulePanelToggleTransaction(transaction.generation, "class-mutation");
          return;
        }
        if (panelMutationFrame) return;
        const generation = panelToggleGeneration;
        panelMutationFrame = requestAnimationFrame(() => {
          panelMutationFrame = 0;
          if (!desktopPanelMutationAllowed() || generation !== panelToggleGeneration) return;
          desktopPanels.forEach(syncPanel);
        });
      };
      const schedulePanelResize = () => {
        clearTimeout(panelResizeTimer);
        panelResizeTimer = setTimeout(syncDesktopPanelMode, 120);
      };
      const isResetIntent = (button) => button.textContent.includes("重置");
      const managedPanelNodesConnected = () => stage?.isConnected && desktopPanels.every((panel) =>
        [panel.wrapper, panel.header, panel.body, panel.toggle].every((node) => node.isConnected));
      const teardownDesktopPanels = () => {
        cancelPanelToggleTransaction("disconnect");
        clearTimeout(panelResizeTimer);
        panelResizeTimer = 0;
        if (panelMutationFrame) cancelAnimationFrame(panelMutationFrame);
        panelMutationFrame = 0;
        if (desktopActive) deactivateDesktopPanels();
        else desktopPanels.forEach((panel) => {
          cancelPanelDrag(panel);
          cancelPanelFrames(panel);
        });
        if (mutationObserver) mutationObserver.disconnect();
        if (positionedParentObserver) positionedParentObserver.disconnect();
        if (resizeObserver) resizeObserver.disconnect();
        if (lifecycleObserver) lifecycleObserver.disconnect();
        mutationObserver = null;
        positionedParentObserver = null;
        resizeObserver = null;
        lifecycleObserver = null;
        panelCleanupCallbacks.splice(0).reverse().forEach((cleanup) => cleanup());
        desktopPanels = [];
      };
      const installDesktopPanels = () => {
        if (panelCoordinatorInstalled) return;
        panelCoordinatorInstalled = true;
        const resolved = resolveDesktopPanels();
        if (!resolved) return;
        desktopPanels = resolved;
        desktopPanels.forEach(bindPanelDrag);
        mutationObserver = new MutationObserver(queuePanelSync);
        desktopPanels.forEach((panel) => {
          mutationObserver.observe(panel.wrapper, {
            attributes:true,
            attributeFilter:["class", "data-moved"],
          });
          mutationObserver.observe(panel.body, {
            attributes:true,
            attributeFilter:["class"],
          });
        });
        const positionedParents = [...new Set(desktopPanels.map((panel) => panel.wrapper.offsetParent))]
          .filter((parent) => parent && parent !== stage);
        if (positionedParents.length) {
          positionedParentObserver = new MutationObserver(schedulePanelResize);
          positionedParents.forEach((parent) => positionedParentObserver.observe(parent, {
            attributes:true,
            attributeFilter:["class", "style"],
          }));
        }
        bindPanelListener(window, "resize", schedulePanelResize);
        if ("ResizeObserver" in window) {
          resizeObserver = new ResizeObserver(schedulePanelResize);
          resizeObserver.observe(stage);
          positionedParents.forEach((parent) => resizeObserver.observe(parent));
        }
        lifecycleObserver = new MutationObserver(() => {
          if (!managedPanelNodesConnected()) teardownDesktopPanels();
        });
        lifecycleObserver.observe(document.documentElement, { childList:true, subtree:true });
        const resetButtons = document.querySelectorAll("#resetBtn");
        if (resetButtons.length === 1) {
          const resetButton = document.getElementById("resetBtn");
          const onResetClick = () => {
            if (!isResetIntent(resetButton)) return;
            resetDesktopPanelLayout();
            beginPanelResetTransaction();
          };
          bindPanelListener(resetButton, "click", onResetClick, true);
        } else {
          console.warn("[desktop-panels] expected one reset button", "resetBtn");
        }
        const panelCoordinatorApi = { version:panelStandardVersion };
        if (window.__CODEX_PHYSICS_PANEL_TEST__ === true) panelCoordinatorApi.getTransactionState = panelToggleDebugSnapshot;
        window.__codexDesktopPanels = Object.freeze(panelCoordinatorApi);
        syncDesktopPanelMode();
      };
      const isolateThemePointer = (event) => {
        if (button.contains(event.target)) event.stopPropagation();
      };
      window.addEventListener("pointerdown", isolateThemePointer, true);
      window.addEventListener("mousedown", isolateThemePointer, true);
      window.addEventListener("touchstart", isolateThemePointer, { capture:true, passive:true });
      window.addEventListener("click", (event) => {
        if (!button.contains(event.target)) return;
        event.stopPropagation();
        applyTheme(root.dataset.theme === "light" ? "dark" : "light", true);
      }, true);
      window.addEventListener("storage", (event) => {
        if (event.key === themeKey) applyTheme(event.newValue, false);
      });
      applyTheme(root.dataset.theme, false);
      installDesktopPanels();
    })();
  </script>
<script id="codex-physics-mode-runtime">
(() => {
  "use strict";
  const VERSION = "physics-middle-mode-controls-v1";
  const AUTO_DEMO_TIMING = Object.freeze({
    cursorPress:220,
    panelReveal:180,
    buttonAim:360,
    dragSoft:720,
    actionMotion:820,
    selectFast:320,
    selectCompare:560,
    observePrimary:780,
    observeSecondary:760,
    observeComparison:700,
    recordConfirm:420,
    stepTransition:460,
    analysisLead:620,
    actionSettle:120,
  });
  const pending = window.__codexPendingModeAdapters;
  delete window.__codexPendingModeAdapters;
  delete window.__codexRegisterModeAdapter;
  if (!Array.isArray(pending) || pending.length !== 1) {
    throw new Error(`[mode-controls] expected one adapter, received ${pending?.length ?? 0}`);
  }
  const adapter = pending[0];
  const requiredMethods = [
    "getState",
    "bindController",
    "startDemo",
    "cancelDemo",
    "resetChallenge",
    "setFreeMode",
    "captureFreeEntry",
    "restoreFreeEntry",
  ];
  for (const method of requiredMethods) {
    if (typeof adapter[method] !== "function") {
      throw new TypeError(`[mode-controls] adapter is missing ${method}()`);
    }
  }
  const state = adapter.getState();
  if (!state || typeof state !== "object") {
    throw new TypeError("[mode-controls] adapter state must be an object");
  }
  const resetBtn = document.getElementById("resetBtn");
  const autoDemoBtn = document.getElementById("autoDemoBtn");
  const freeBtn = document.getElementById("freeBtn");
  const taskCard = document.getElementById("taskCard");
  const modeTag = document.getElementById("modeTag") || document.getElementById("modeChip");
  const statusTag = document.getElementById("statusTag") || document.getElementById("stateChip");
  if (!resetBtn || !autoDemoBtn || !freeBtn || !taskCard || !modeTag || !statusTag) {
    throw new Error("[mode-controls] required mode-control DOM is missing");
  }

  let generation = 0;
  let freeEntry = null;
  let demoCompletedPresentation = false;
  let pauseStartedAt = 0;
  let pausedDuration = 0;
  const rawSleep = (milliseconds) =>
    new Promise((resolve) => setTimeout(resolve, milliseconds));
  const currentRunId = () => generation;
  const activeNow = () => {
    const now = performance.now();
    const activePause = pauseStartedAt ? now - pauseStartedAt : 0;
    return now - pausedDuration - activePause;
  };
  const assertCurrent = (runId) => {
    if (runId !== generation) {
      const error = new Error("MODE_CONTROL_CANCELLED");
      error.code = "MODE_CONTROL_CANCELLED";
      throw error;
    }
  };
  const wait = async (milliseconds, phase, runId) => {
    const requested = Math.max(Number(milliseconds) || 0, 0);
    const phaseFloor = phase ? AUTO_DEMO_TIMING[phase] : 0;
    if (phase && !Number.isFinite(phaseFloor)) {
      throw new RangeError(`[mode-controls] unknown timing phase ${phase}`);
    }
    let remaining = Math.max(requested, phaseFloor || 0);
    while (remaining > 0) {
      assertCurrent(runId);
      if (state.autoPaused) {
        await rawSleep(16);
        continue;
      }
      const slice = Math.min(remaining, 16);
      await rawSleep(slice);
      assertCurrent(runId);
      if (!state.autoPaused) remaining -= slice;
    }
  };

  const setText = (element, value) => {
    if (element.textContent !== value) element.textContent = value;
  };
  const setDisabled = (element, value) => {
    if (element.disabled !== value) element.disabled = value;
  };
  const setLabel = (element, prefix, value) => setText(element, `${prefix}${value}`);
  const syncControls = () => {
    const playing = Boolean(state.autoPlaying);
    const paused = playing && Boolean(state.autoPaused);
    const free = Boolean(state.freeMode);
    setText(resetBtn, playing
      ? (paused ? "继续演示" : "暂停演示")
      : (free ? "重置操作" : "重置关卡"));
    setText(autoDemoBtn, playing ? "退出演示" : "演示模式");
    setText(freeBtn, free ? "退出自由模式" : "自由模式");
    setDisabled(autoDemoBtn, free && !playing);
    setDisabled(freeBtn, playing);
    setDisabled(resetBtn, false);
    const pressed = paused ? "true" : "false";
    if (resetBtn.getAttribute("aria-pressed") !== pressed) {
      resetBtn.setAttribute("aria-pressed", pressed);
    }
    taskCard.classList.toggle("free-mode", free);
  };
  const syncModeLabels = (completed = false) => {
    if (state.autoPlaying) {
      setLabel(
        modeTag,
        "模式：",
        state.autoPaused ? "演示模式 · 已暂停" : "演示模式 · 自动运行",
      );
      setLabel(statusTag, "状态：", state.autoPaused ? "演示已暂停" : "演示中");
      return;
    }
    if (state.freeMode) {
      setLabel(modeTag, "模式：", "自由模式 · 自主探索");
      setLabel(statusTag, "状态：", "自由探索");
      return;
    }
    if (completed) {
      setLabel(modeTag, "模式：", "演示模式 · 演示完成");
      setLabel(statusTag, "状态：", "已完成");
      return;
    }
    const idleMode = adapter.getIdleModeLabel?.();
    const idleStatus = adapter.getIdleStatusLabel?.();
    if (idleMode) setLabel(modeTag, "模式：", idleMode);
    if (idleStatus) setLabel(statusTag, "状态：", idleStatus);
  };
  const refresh = () => {
    if (typeof adapter.refreshView === "function") adapter.refreshView();
  };

  const beginDemo = async () => {
    if (state.freeMode || state.autoPlaying) return;
    const runId = ++generation;
    demoCompletedPresentation = false;
    pauseStartedAt = 0;
    pausedDuration = 0;
    state.autoPaused = false;
    let run;
    try {
      run = Promise.resolve(adapter.startDemo());
    } catch (error) {
      state.autoPlaying = false;
      state.autoPaused = false;
      syncControls();
      throw error;
    }
    if (!state.autoPlaying) state.autoPlaying = true;
    syncControls();
    syncModeLabels(false);
    try {
      await run;
    } catch (error) {
      if (runId !== generation || error?.code === "MODE_CONTROL_CANCELLED") return;
      throw error;
    } finally {
      if (runId !== generation) return;
      state.autoPlaying = false;
      state.autoPaused = false;
      pauseStartedAt = 0;
      demoCompletedPresentation = Boolean(adapter.isDemoCompleted?.() ?? state.demoCompleted);
      refresh();
      syncControls();
      syncModeLabels(demoCompletedPresentation);
    }
  };
  const togglePause = () => {
    if (!state.autoPlaying) return;
    if (!state.autoPaused) {
      state.autoPaused = true;
      pauseStartedAt = performance.now();
      adapter.pauseApparatus?.();
    } else {
      const now = performance.now();
      if (pauseStartedAt) pausedDuration += now - pauseStartedAt;
      pauseStartedAt = 0;
      state.autoPaused = false;
      adapter.resumeApparatus?.();
    }
    syncControls();
    syncModeLabels(false);
  };
  const exitDemo = () => {
    if (!state.autoPlaying) return;
    generation += 1;
    adapter.cancelDemo();
    state.autoPlaying = false;
    state.autoPaused = false;
    state.freeMode = false;
    pauseStartedAt = 0;
    pausedDuration = 0;
    demoCompletedPresentation = false;
    adapter.resetChallenge();
    refresh();
    syncControls();
    syncModeLabels(false);
  };
  const toggleFree = () => {
    if (state.autoPlaying) return;
    if (!state.freeMode) {
      demoCompletedPresentation = false;
      freeEntry = adapter.captureFreeEntry();
      adapter.setFreeMode(true);
      state.freeMode = true;
    } else {
      adapter.setFreeMode(false);
      state.freeMode = false;
      freeEntry = null;
    }
    refresh();
    syncControls();
    syncModeLabels(false);
  };
  const resetIntent = () => {
    if (state.autoPlaying) {
      togglePause();
      return;
    }
    if (state.freeMode) {
      if (freeEntry === null) {
        throw new Error("[mode-controls] free-mode entry snapshot is missing");
      }
      adapter.restoreFreeEntry(freeEntry);
      state.freeMode = true;
    } else {
      generation += 1;
      demoCompletedPresentation = false;
      adapter.resetChallenge();
      state.autoPlaying = false;
      state.autoPaused = false;
      state.freeMode = false;
    }
    refresh();
    syncControls();
    syncModeLabels(false);
  };

  const controller = Object.freeze({
    currentRunId,
    now:activeNow,
    timing:AUTO_DEMO_TIMING,
    wait,
  });
  adapter.bindController(controller);
  const onModeControlClick = (event) => {
    const button = event.target.closest("button");
    if (![resetBtn, autoDemoBtn, freeBtn].includes(button)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if (button === resetBtn) resetIntent();
    else if (button === freeBtn) toggleFree();
    else if (state.autoPlaying) exitDemo();
    else void beginDemo();
  };
  for (const button of [resetBtn, autoDemoBtn, freeBtn]) {
    button.addEventListener("click", onModeControlClick, true);
  }

  let ownershipSyncQueued = false;
  const ownershipObserver = new MutationObserver(() => {
    if (ownershipSyncQueued) return;
    ownershipSyncQueued = true;
    queueMicrotask(() => {
      ownershipSyncQueued = false;
      syncControls();
      syncModeLabels(demoCompletedPresentation);
    });
  });
  for (const element of [resetBtn, autoDemoBtn, freeBtn, modeTag, statusTag]) {
    ownershipObserver.observe(element, {
      attributes:true,
      attributeFilter:["disabled", "aria-pressed"],
      childList:true,
      subtree:true,
    });
  }

  Object.defineProperty(window, "__codexModeControls", {
    configurable:true,
    value:Object.freeze({ version:VERSION }),
  });
  if (window.__CODEX_MODE_CONTROLS_TEST__ === true) {
    Object.defineProperty(window, "__codexModeControlsDebug", {
      configurable:true,
      value:Object.freeze({
        snapshot:() => Object.freeze({
          generation,
          freeEntry:Boolean(freeEntry),
          playing:Boolean(state.autoPlaying),
          paused:Boolean(state.autoPaused),
          free:Boolean(state.freeMode),
        }),
      }),
    });
  }
  delete window.__CODEX_MODE_CONTROLS_TEST__;
  syncControls();
  syncModeLabels(false);
})();
</script>
