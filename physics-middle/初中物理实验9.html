  <script id="codex-theme-bootstrap">
    (() => {
      const themeKey = "xingnian.physics.theme";
      let theme = "dark";
      try {
        const storedTheme = localStorage.getItem(themeKey);
        if (storedTheme === "light" || storedTheme === "dark") theme = storedTheme;
      } catch (error) {
        console.warn("[theme-pilot] failed to read saved theme", error);
      }
      document.documentElement.dataset.theme = theme;
    })();

function trackTimer(id){ state.timers.add(id); return id; }
function untrackTimer(id){ state.timers.delete(id); }
function clearTrackedTimers(){
  state.timers.forEach((id)=>clearTimeout(id));
  state.timers.clear();
}
function wait(ms){
  return new Promise((resolve)=>{
    const id = setTimeout(()=>{ untrackTimer(id); resolve(); }, ms);
    trackTimer(id);
  });
}
async function waitAuto(ms, runId){
  let remaining = Math.max(0, Number(ms) || 0);
  while(remaining > 0){
    if(runId !== state.demoRunId) throw new Error('AUTO_DEMO_CANCELLED');
    if(state.autoPaused){
      await new Promise((resolve)=>setTimeout(resolve, 16));
      continue;
    }
    const slice = Math.min(remaining, 16);
    await new Promise((resolve)=>setTimeout(resolve, slice));
    if(runId !== state.demoRunId) throw new Error('AUTO_DEMO_CANCELLED');
    if(!state.autoPaused) remaining -= slice;
  }
}
async function waitForAutoCondition(check, timeoutMs, runId, errorCode){
  let remaining = Math.max(0, timeoutMs);
  while(remaining > 0){
    if(runId !== state.demoRunId) throw new Error('AUTO_DEMO_CANCELLED');
    if(check()) return;
    const slice = Math.min(80, remaining);
    await waitAuto(slice, runId);
    remaining -= slice;
  }
  throw new Error(errorCode);
}

function tickHeat(){
  if(state.rafId) cancelAnimationFrame(state.rafId);
  const loop = () => {
    if(!state.heating){
      state.rafId = 0;
      return;
    }
    if(state.autoPlaying && state.autoPaused){
      state.rafId = requestAnimationFrame(loop);
      return;
    }
    let changed = false;
    for(const rod of RODS){
      if(state.progress[rod.key] < 100){
        state.progress[rod.key] = Math.min(100, state.progress[rod.key] + rod.speed * 0.38);
        rod.heatEl.style.width = `${state.progress[rod.key]}%`;
        changed = true;
      }
      if(!state.dropped[rod.key] && state.progress[rod.key] >= rod.threshold){
        changed = recordRodDrop(rod) || changed;
      }
    }
    if(changed) refreshInterface();
    state.rafId = requestAnimationFrame(loop);
  };
  state.rafId = requestAnimationFrame(loop);
}

function getStageRect(){ return stage.getBoundingClientRect(); }
function setDockPos(el, x, y){
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.style.right = 'auto';
  el.style.bottom = 'auto';
}
function clampDockPos(el, x, y){
  const s = getStageRect();
  const r = el.getBoundingClientRect();
  const pad = 10;
  return { x: clamp(x, pad, s.width - r.width - pad), y: clamp(y, pad, s.height - r.height - pad) };
}
function clampDockInsideStage(el){
  if(!el) return;
  const s = getStageRect();
  const r = el.getBoundingClientRect();
  if(!s.width || !s.height || !r.width || !r.height) return;
  const next = clampDockPos(el, r.left - s.left, r.top - s.top);
  setDockPos(el, next.x, next.y);
}
let dockClampFrame = 0;
function scheduleDockClamp(){
  if(dockClampFrame) cancelAnimationFrame(dockClampFrame);
  dockClampFrame = requestAnimationFrame(()=>{
    dockClampFrame = 0;
    clampDockInsideStage(controlDock);
    clampDockInsideStage(dataDock);
    resolveDrawerOverlap(true);
  });
}
function overlapArea(a, b){
  const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
  const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
  return x * y;
}
function bringToFront(which){
  if(which === 'control'){
    document.documentElement.style.setProperty('--zPanel', '42');
    document.documentElement.style.setProperty('--zResults', '39');
  }else{
    document.documentElement.style.setProperty('--zResults', '42');
    document.documentElement.style.setProperty('--zPanel', '39');
  }
}
function resolveDrawerOverlap(force = false){
  const narrow = window.innerWidth <= 560;
  const enforce = force || state.autoPlaying;
  if(!enforce && !narrow) return;
  if(state.panelCollapsed || state.dataCollapsed) return;
  const s = getStageRect();
  const c = controlDock.getBoundingClientRect();
  const d = dataDock.getBoundingClientRect();
  if(overlapArea(c, d) <= 0) return;
  const pad = 10;
  const rightX = s.width - d.width - pad;
  const leftX = pad;
  const belowY = c.bottom - s.top + 8;
  const aboveY = c.top - s.top - d.height - 8;
  const candidates = [
    { x:rightX, y:belowY },
    { x:rightX, y:aboveY },
    { x:leftX, y:belowY },
    { x:leftX, y:aboveY }
  ];
  let best = null;
  let bestOv = Infinity;
  for(const raw of candidates){
    const next = clampDockPos(dataDock, raw.x, raw.y);
    const rect = { left:s.left + next.x, top:s.top + next.y, right:s.left + next.x + d.width, bottom:s.top + next.y + d.height };
    const ov = overlapArea(c, rect);
    if(ov < bestOv){ bestOv = ov; best = next; }
    if(ov <= 0) break;
  }
  if(best) setDockPos(dataDock, best.x, best.y);
}
function defaultDockPositions(force = false){
  const s = getStageRect();
  const pad = 10;
  const cr = controlDock.getBoundingClientRect();
  const dr = dataDock.getBoundingClientRect();
  if(force || !state.dockMoved.control) setDockPos(controlDock, s.width - cr.width - pad, pad);
  const cNow = controlDock.getBoundingClientRect();
  const baseY = cNow.bottom - s.top + 8;
  if(force || !state.dockMoved.data){
    const next = clampDockPos(dataDock, s.width - dr.width - pad, baseY);
    setDockPos(dataDock, next.x, next.y);
  }
  resolveDrawerOverlap();
}
function bindDockDrag(el, headEl, kind){
  let dragging = false;
  let sx = 0;
  let sy = 0;
  let bx = 0;
  let by = 0;
  function currentPos(){
    const s = getStageRect();
    const r = el.getBoundingClientRect();
    return { x:r.left - s.left, y:r.top - s.top };
  }
  function finishDrag(e){
    if(!dragging) return;
    dragging = false;
    el.style.boxShadow = '';
    try { headEl.releasePointerCapture(e.pointerId); }
    catch (err) { console.warn('releasePointerCapture failed', err); }
    resolveDrawerOverlap(true);
  }
  headEl.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('button')) return;
    dragging = true;
    bringToFront(kind);
    el.style.boxShadow = getComputedStyle(document.documentElement).getPropertyValue('--shadow');
    const p = currentPos();
    bx = p.x;
    by = p.y;
    sx = e.clientX;
    sy = e.clientY;
    state.dockMoved[kind] = true;
    try { headEl.setPointerCapture(e.pointerId); }
    catch (err) { console.warn('setPointerCapture failed', err); }
    e.preventDefault();
  });
  headEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const p = clampDockPos(el, bx + (e.clientX - sx), by + (e.clientY - sy));
    setDockPos(el, p.x, p.y);
    e.preventDefault();
  });
  headEl.addEventListener('pointerup', finishDrag);
  headEl.addEventListener('pointercancel', finishDrag);
}
bindDockDrag(controlDock, controlHead, 'control');
bindDockDrag(dataDock, dataHead, 'data');

function refreshInteractionLocks(){
  const autoLocked = state.autoPlaying;
  heaterToggleBtn.disabled = autoLocked || state.completed || state.awaitingQuiz;
  checkBtn.disabled = autoLocked || state.freeMode || state.completed || state.awaitingQuiz;
  trialResetBtn.disabled = autoLocked;
  resetBtn.disabled = false;
  freeBtn.disabled = autoLocked;
  if(autoLocked){
    autoDemoBtn.textContent = '退出演示';
    autoDemoBtn.disabled = false;
    resetBtn.textContent = state.autoPaused ? '继续演示' : '暂停演示';
  }else{
    autoDemoBtn.textContent = '演示模式';
    autoDemoBtn.disabled = state.freeMode;
    resetBtn.textContent = state.freeMode ? '重置操作' : '重置关卡';
  }

function setFreeMode(on){
  if(state.autoPlaying) return;
  if(on){
    challengeEntrySnapshot = captureChallengeState();
    state.freeMode = true;
    state.completed = false;
    state.demoCompleted = false;
    state.awaitingQuiz = false;
    state.warningStep = -1;

  }else{
    const snapshot = challengeEntrySnapshot;
    challengeEntrySnapshot = null;
    if(snapshot) restoreChallengeState(snapshot);
    else resetAll({ preserveAuto:false, showTip:false });
  }
  updateModeHud();
  refreshInteractionLocks();
  renderStepDots();
  refreshInterface();
}

function resetRound(opts = {}){
  const { keepMode = true, showTip = false } = opts;
  setHeating(false);
  if(state.rafId){
    cancelAnimationFrame(state.rafId);
    state.rafId = 0;
  }
  state.progress = { copper:0, iron:0, glass:0 };
  state.dropped = { copper:false, iron:false, glass:false };
  state.dropOrder = [];
  state.awaitingQuiz = false;
  state.quizAnswered = false;
  state.quizCorrect = false;
  state.lastQuizAnswer = '';

function resetAll(opts = {}){

  if(state.rafId){

    state.rafId = 0;
  }
  const keepFree = preserveFreeMode && state.freeMode;
  if(!preserveAuto){
    state.autoPlaying = false;
    state.autoPaused = false;
    state.demoRunId += 1;
  }
  state.completed = false; state.demoCompleted = false;
  state.successCooldown = false;
  state.warningStep = -1;
  state.currentTask = 0;
  state.records = [];
  state.unseenRecordCount = 0;

  state.quizAnswered = false;
  state.quizCorrect = false;

function captureChallengeState(){
  return {
    currentTask: state.currentTask,
    completed: state.completed,
    demoCompleted: state.demoCompleted,
    warningStep: state.warningStep,
    records: state.records.map((record)=>({ ...record })),

function restoreRodState(){

function restoreChallengeState(snapshot){

function assertAutoRecorded(beforeLen){

function setDemoCursor(x, y){

function hideDemoCursor(){

  demoCursor.style.top = '-200px';
  demoCursorPulse.style.left = '-200px';
  demoCursorPulse.style.top = '-200px';

async function clickDemoCursor(ms = 200, runId = state.demoRunId){
  if(runId !== state.demoRunId) throw new Error('AUTO_DEMO_CANCELLED');
  demoCursor.classList.add('clicking');
  const x = Number.parseFloat(demoCursor.style.left || '0');
  const y = Number.parseFloat(demoCursor.style.top || '0');

  demoCursorPulse.style.top = `${y}px`;

function elemCenterInStage(el){
  const s = stage.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x:r.left - s.left + r.width / 2, y:r.top - s.top + r.height / 2 };
}
async function demoClickElement(el, runId, action = null){
  const p = elemCenterInStage(el);
  setDemoCursor(p.x, p.y);
  await waitAuto(AUTO_DEMO_TIMING.buttonAim, runId);
  await clickDemoCursor(AUTO_DEMO_TIMING.cursorPress, runId);

  await waitAuto(AUTO_DEMO_TIMING.actionSettle, runId);
}

function stopAutoDemo(byUser = false){
  if(!state.autoPlaying) return;
  state.demoRunId += 1;
  state.autoPlaying = false;
  state.autoPaused = false;
  stage.classList.remove('lab-demo-paused');

function toggleAutoPause(){
  if(!state.autoPlaying) return;

window.getLabPauseSnapshot = () => ({

async function startAutoDemo(){
  if(state.autoPlaying || state.freeMode) return;
  state.autoPlaying = true;
  state.autoPaused = false;
  stage.classList.remove('lab-demo-paused');
  const runId = ++state.demoRunId;
  updateModeHud();
  refreshInteractionLocks();
  resetAll({ preserveAuto:true, showTip:false });
  ensureAutoDrawerLayout();
  setStatus('演示中');

  try {
    await waitAuto(AUTO_DEMO_TIMING.panelReveal, runId);
    await demoClickElement(heaterBtn, runId, async ()=>{ setHeating(true); });
    await waitForAutoCondition(() => TASKS[0].check(), 2200, runId, 'AUTO_STEP1_NOT_READY');
    let before = state.records.length;
    await demoClickElement(checkBtn, runId, async ()=>{ passCurrentTask(true); });
    assertAutoRecorded(before);
    await waitAuto(AUTO_DEMO_TIMING.stepTransition, runId);
    await demoClickElement(heaterBtn, runId, async ()=>{ setHeating(true); });

    await waitForAutoCondition(() => TASKS[1].check(), 9000, runId, 'AUTO_STEP2_NOT_READY');
    before = state.records.length;
    await demoClickElement(checkBtn, runId, async ()=>{ passCurrentTask(true); });
    assertAutoRecorded(before);
    await waitAuto(AUTO_DEMO_TIMING.analysisLead, runId);

    const answerBtn = quizRow.querySelector('button[data-answer="copper"]');
    if(!answerBtn) throw new Error('AUTO_QUIZ_NOT_READY');
    before = state.records.length;
    await demoClickElement(answerBtn, runId, async ()=>{ chooseAnswer('copper', true); });
    assertAutoRecorded(before);

    if(!state.completed) throw new Error('AUTO_NOT_COMPLETED');
    setStatus('挑战完成');
  } catch (err) {
    const msg = String(err && err.message ? err.message : err);
    if(msg !== 'AUTO_DEMO_CANCELLED'){
      console.error('[autoDemo] failed:', err);
      if(msg.startsWith('AUTO_RECORD')) showToast('演示记录失败，请重试。');
      else showToast('演示中断，已恢复可操作状态。');
      if(!state.completed) setStatus('待操作');
    }
  } finally {
    hideDemoCursor();
    if(runId === state.demoRunId){
      state.autoPlaying = false;
      state.autoPaused = false;
      stage.classList.remove('lab-demo-paused');
      updateModeHud();
      refreshInteractionLocks();
      if(!state.completed) setStatus(state.freeMode ? '自由探索' : '待操作');
    }
  }
}

resetBtn.onclick = () => {

};
okBtn.onclick = () => { doneMask.style.display = 'none'; };

const audioState = { ctx:null, muted:false, unlocked:false };
function syncAudioToggle(){
  audioToggle.classList.toggle('muted', audioState.muted);
  audioToggle.classList.toggle('ready', audioState.unlocked && !audioState.muted);
  audioToggle.textContent = audioState.muted ? '🔇' : '🔊';
  audioToggle.setAttribute('aria-pressed', String(!audioState.muted));
  audioToggle.setAttribute('aria-label', audioState.muted ? '开启音效' : '关闭音效');
  audioToggle.title = audioState.muted ? '开启音效' : '关闭音效';
}
function ensureAudio(){
  if(audioState.muted) return null;
  if(!audioState.ctx){
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if(!AudioContextClass) return null;
    try {
      audioState.ctx = new AudioContextClass();
    } catch (error) {
      console.warn('AudioContext unavailable', error);
      return null;
    }
  }
  audioState.unlocked = true;
  if(audioState.ctx.state === 'suspended'){
    audioState.ctx.resume().catch((error)=>console.warn('AudioContext resume failed', error));
  }
  syncAudioToggle();
  return audioState.ctx;
}
function tone(frequency, duration, type = 'sine', gain = .03, delay = 0){
  const ctx = ensureAudio();
  if(!ctx) return;
  const start = ctx.currentTime + delay;
  const oscillator = ctx.createOscillator();
  const envelope = ctx.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, start);
  envelope.gain.setValueAtTime(.0001, start);
  envelope.gain.exponentialRampToValueAtTime(gain, start + .012);
  envelope.gain.exponentialRampToValueAtTime(.0001, start + duration);
  oscillator.connect(envelope).connect(ctx.destination);
  oscillator.start(start);
  oscillator.stop(start + duration + .03);
}
function playUiSound(kind){
  if(audioState.muted) return;
  window.dispatchEvent(new CustomEvent('lab-ui-sound', { detail:{ kind } }));
  if(kind === 'warn'){
    tone(190, .16, 'sawtooth', .04);
    tone(145, .2, 'sawtooth', .035, .11);
  }else if(kind === 'finish'){
    tone(523, .18, 'sine', .04);
    tone(659, .2, 'sine', .04, .13);
    tone(784, .28, 'sine', .045, .27);
  }else if(kind === 'step'){
    tone(480, .11, 'triangle', .03);
    tone(660, .16, 'triangle', .032, .08);
  }else if(kind === 'drop'){
    tone(310, .07, 'triangle', .025);
    tone(185, .12, 'sine', .026, .05);
  }else if(kind === 'heater'){
    tone(220, .08, 'square', .018);
    tone(440, .16, 'sine', .026, .05);
  }else if(kind === 'hint'){
    tone(660, .12, 'triangle', .028);
  }else{
    tone(360, .07, 'sine', .018);
  }
}
window.playUiSound = playUiSound;
window.labAudio = {
  play: playUiSound,
  isMuted: ()=>audioState.muted,
  setMuted(value){
    audioState.muted = !!value;
    syncAudioToggle();
    return audioState.muted;
  }
};
document.addEventListener('pointerdown', ()=>ensureAudio(), { passive:true });
document.addEventListener('click', (event)=>{
  const button = event.target.closest('button');
  if(!button || button === audioToggle || button.disabled) return;
  playUiSound('tap');
}, true);
audioToggle.addEventListener('click', (event)=>{
  event.preventDefault();
  event.stopPropagation();
  window.labAudio.setMuted(!audioState.muted);
  if(!audioState.muted){
    ensureAudio();
    playUiSound('hint');
  }
});

function init(){
  renderRecordTable();
  refreshDataNotice();
  resetAll({ preserveAuto:false, showTip:false });
  syncAudioToggle();
}

const relayout = (() => {
  let t = 0;
  return () => {
    if(t){
      clearTimeout(t);
      untrackTimer(t);
    }
    t = trackTimer(setTimeout(()=>{
      t = 0;
      defaultDockPositions();
      resolveDrawerOverlap(true);
    }, 120));
  };
})();

window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', relayout);
window.addEventListener('beforeunload', ()=>{
  clearTrackedTimers();
  if(state.rafId) cancelAnimationFrame(state.rafId);
});

init();
</script>

<script id="exp35-ui-normalize-runtime">
(function(){
  "use strict";
  var $ = function(selector){ return document.querySelector(selector); };
  var hintLamp = $("#hintLamp");
  var hintPop = $("#hintPop");
  var taskHint = $("#taskHint");
  var taskText = $("#taskText");
  var dataDock = $("#dataDock");
  var dataNotice = $("#dataNotice");
  var recordBody = $("#recordBody");
  var recordChart = $("#recordChart");
  var modalTitle = $("#doneMask .modal h3");

  try {
    if (typeof state !== "undefined") window.state = state;
  } catch (_) {}

  if (modalTitle && !/实验完成/.test(modalTitle.textContent || "")) {
    modalTitle.textContent = "实验完成";
  }

  function updateHintText(){
    if (!hintPop) return;
    var hint = taskHint ? taskHint.textContent.trim() : "";
    var text = taskText ? taskText.textContent.trim() : "";
    hintPop.textContent = hint || text || "按步骤操作器材，观察现象并记录数据。";
  }

  if (hintLamp && hintPop && !hintLamp.dataset.exp35Bound) {
    hintLamp.dataset.exp35Bound = "1";
    updateHintText();
    hintLamp.addEventListener("click", function(){
      updateHintText();
      hintPop.classList.toggle("open");
    });
  }

  function drawRecordChart(){
    if (!recordChart) return;
    var ctx = recordChart.getContext("2d");
    if (!ctx) return;
    var dpr = window.devicePixelRatio || 1;
    var w = recordChart.clientWidth || 320;
    var h = recordChart.clientHeight || 180;
    var nextW = Math.max(1, Math.round(w * dpr));
    var nextH = Math.max(1, Math.round(h * dpr));
    if (recordChart.width !== nextW || recordChart.height !== nextH) {
      recordChart.width = nextW;
      recordChart.height = nextH;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(155,211,255,.22)";
    ctx.lineWidth = 1;
    for (var x = 24; x < w; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, 14); ctx.lineTo(x, h - 18); ctx.stroke();
    }
    for (var y = 28; y < h - 8; y += 30) {
      ctx.beginPath(); ctx.moveTo(12, y); ctx.lineTo(w - 12, y); ctx.stroke();
    }
    var rows = recordBody ? Array.from(recordBody.querySelectorAll("tr")).filter(function(row){
      return row.querySelectorAll("td").length > 1 && !/当前无记录|暂无|还没有记录/.test(row.textContent);
    }) : [];
    ctx.font = "700 13px Arial";
    ctx.fillStyle = "#cfe4ff";
    ctx.fillText("记录概览", 16, 24);
    if (!rows.length) {
      ctx.font = "12px Arial";
      ctx.fillStyle = "rgba(235,245,255,.64)";
      ctx.fillText("完成步骤后，这里显示记录进度。", 16, 52);
      return;
    }
    var max = Math.max(3, rows.length);
    rows.slice(0, 8).forEach(function(row, index){
      var barW = (w - 96) * ((index + 1) / max);
      var y = 46 + index * 20;
      ctx.fillStyle = ["#ffd54f", "#3ddc97", "#5bbcff", "#ef476f"][index % 4];
      ctx.fillRect(72, y - 10, barW, 9);
      ctx.fillStyle = "rgba(235,245,255,.86)";
      ctx.font = "12px Arial";
      ctx.fillText("记录 " + (index + 1), 16, y);
    });
  }

  if (recordBody && recordChart && !recordChart.dataset.exp35Bound) {
    recordChart.dataset.exp35Bound = "1";
    new MutationObserver(drawRecordChart).observe(recordBody, { childList:true, subtree:true, characterData:true });
    window.addEventListener("resize", drawRecordChart);
    setTimeout(drawRecordChart, 60);
  }

  if (dataDock && dataNotice && !dataDock.dataset.exp35NoticeBound) {
    dataDock.dataset.exp35NoticeBound = "1";
    var clearNotice = function(){
      dataNotice.textContent = "0";
      dataNotice.classList.remove("show");
      dataNotice.classList.add("hidden");
    };
    dataDock.addEventListener("click", function(evt){
      if (evt.target && evt.target.id === "dataToggleBtn") setTimeout(clearNotice, 20);
    });
  }
})();
</script>

      const panelBodyMaxHeight = 420;
      const panelBodyMinAvailableHeight = 64;
      const panelHeaderSelector = "[data-drag-handle],.dock-header,.dockHead,.dock-head,.drawer-header,.drawer-head,.panelHead,.resultsHead";
      const panelBodySelector = ".dock-body,.dockBody,.drawer-body,.panelBody,.resultsBody";
      const panelVariants = [
        {
          kind:"dock",
          panels:[
            { id:"controlDock", toggleSelector:"#controlToggleBtn" },
            { id:"dataDock", toggleSelector:"#dataToggleBtn" },
          ],
        },
        {
          kind:"drawer63",
          panels:[
            { id:"controlDrawer", toggleSelector:"[data-drawer=\"controlDrawer\"]" },
            { id:"dataDrawer", toggleSelector:"[data-drawer=\"dataDrawer\"]" },
          ],
        },
      ];
      let desktopPanels = [];
      let desktopActive = false;
      let desktopInitialized = false;
      let panelCoordinatorInstalled = false;
      let panelMutationFrame = 0;
      let panelResizeTimer = 0;
      let panelToggleGeneration = 0;
      let panelToggleTransaction = null;
      let panelToggleFrame = 0;
      let panelToggleTimer = 0;
      let panelLastTransaction = null;
      const panelToggleSettleMs = 280;
      let mutationObserver = null;
      let resizeObserver = null;
      let lifecycleObserver = null;
      const panelCleanupCallbacks = [];

      const clampPanelValue = (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value));
      const getStageSize = () => {
        if (!stage) return { width:0, height:0 };
        const rect = stage.getBoundingClientRect();
        return {
          width:stage.clientWidth || rect.width,
          height:stage.clientHeight || rect.height,
        };
      };
      const resolveDesktopPanels = () => {
        if (!stage) {
          panelVariants.forEach((variant) => variant.panels.forEach((panel) => {
            console.warn("[desktop-panels] stage was not found for panel", panel.id);
          }));
          return null;
        }
        const presentVariants = panelVariants.filter((variant) => variant.panels.some(({ id }) =>
          document.querySelectorAll(`[id="${id}"]`).length > 0));
        if (!presentVariants.length) {
          panelVariants.forEach((variant) => variant.panels.forEach((panel) => {
            console.warn("[desktop-panels] panel shell was not found", panel.id);
          }));
          return null;
        }
        if (presentVariants.length > 1) {
          presentVariants.forEach((variant) => variant.panels.forEach((panel) => {
            console.warn("[desktop-panels] ambiguous panel variant", panel.id);
          }));
          return null;
        }
        const variant = presentVariants[0];
        let valid = true;
        const panels = variant.panels.map((definition, index) => {
          const panel = { id:definition.id };
          const wrappers = Array.from(document.querySelectorAll(`[id="${definition.id}"]`));
          const toggles = Array.from(document.querySelectorAll(definition.toggleSelector));
          const wrapper = wrappers.length === 1 ? wrappers[0] : null;
          const headerMatches = wrapper
            ? Array.from(wrapper.children).filter((child) => child.matches(panelHeaderSelector))
            : [];
          const bodyMatches = wrapper
            ? Array.from(wrapper.children).filter((child) => child.matches(panelBodySelector))
            : [];
          const toggle = toggles.length === 1 ? toggles[0] : null;
          const issues = [];
          if (!wrapper) issues.push(`wrapper count ${wrappers.length}`);
          if (headerMatches.length !== 1) issues.push(`direct header count ${headerMatches.length}`);
          if (bodyMatches.length !== 1) issues.push(`direct body count ${bodyMatches.length}`);
          if (headerMatches[0] && headerMatches[0] === bodyMatches[0]) issues.push("header and body are the same element");
          if (!toggle || !toggle.matches("button") || !wrapper?.contains(toggle)) {
            issues.push(`contained toggle count ${toggles.length}`);
          }
          if (issues.length) {
            valid = false;
            console.warn("[desktop-panels] invalid panel", panel.id, issues.join(", "));
            return null;
          }
          return {
            id:definition.id,
            kind:variant.kind,
            index,
            wrapper,
            header:headerMatches[0],
            body:bodyMatches[0],
            toggle,
            originalMoved:null,
            anchor:null,
            zIndex:index === 0 ? 36 : 30,
            drag:null,
            measureFrame:0,
            measureRetried:false,
            measureWarned:false,
          };
        });
        return valid ? panels : null;
      };
      const panelIsOpen = (panel) => panel.kind === "dock"
        ? !panel.wrapper.classList.contains("collapsed")
        : panel.wrapper.classList.contains("open");
      const setPanelOpen = (panel, open) => {
        if (panel.kind === "dock") panel.wrapper.classList.toggle("collapsed", !open);
        else panel.wrapper.classList.toggle("open", open);
        panel.body.classList.toggle("collapsed", !open);
      };
      const setPanelDragging = (panel, dragging) => {
        panel.wrapper.dataset.codexPanelDragging = dragging ? "1" : "0";
      };
      const getDefaultAnchors = () => {
        const { width } = getStageSize();
        const control = { x:Math.max(panelSafe, width - panelWidth - 12), y:58 };
        return [control, { x:control.x, y:control.y + panelHeaderHeight + 10 }];
      };
      const applyAnchor = (panel, nextAnchor) => {
        const { width, height } = getStageSize();
        const maximumX = Math.max(panelSafe, width - panelWidth - panelSafe);
        const maximumY = Math.max(panelSafe, height - panelHeaderHeight - panelSafe);
        panel.anchor = {
          x:clampPanelValue(nextAnchor.x, panelSafe, maximumX),
          y:clampPanelValue(nextAnchor.y, panelSafe, maximumY),
        };
        panel.wrapper.style.setProperty("--codex-panel-left", `${panel.anchor.x}px`);
        panel.wrapper.style.setProperty("--codex-panel-top", `${panel.anchor.y}px`);
      };
      const fitAvailableDimension = (desired, available, minimum, maximum) => {
        const safeAvailable = Math.max(0, available);
        if (safeAvailable < minimum) return safeAvailable;
        return clampPanelValue(Math.min(desired, safeAvailable), minimum, maximum);
      };
      const choosePanelPlacement = (panel) => {
        const { width:stageWidth, height:stageHeight } = getStageSize();
        const anchor = panel.anchor || { x:panelSafe, y:panelSafe };
        const bodyRect = panel.body.getBoundingClientRect();
        const measuredWidth = Math.max(panel.body.scrollWidth || 0, bodyRect.width || 0);
        const measuredHeight = Math.max(panel.body.scrollHeight || 0, bodyRect.height || 0);
        const open = panelIsOpen(panel);
        if (open && (!measuredWidth || !measuredHeight)) return null;
        const desiredWidth = clampPanelValue(
          Math.max(measuredWidth, panelBodyMinWidth),
          panelBodyMinWidth,
          panelBodyMaxWidth,
        );
        const desiredHeight = clampPanelValue(
          Math.max(measuredHeight, panelBodyMinHeight),
          panelBodyMinHeight,
          panelBodyMaxHeight,
        );
        const leftSpace = Math.max(0, anchor.x + panelWidth - bodySafe);
        const rightSpace = Math.max(0, stageWidth - anchor.x - bodySafe);
        const leftFits = leftSpace >= desiredWidth;
        const rightFits = rightSpace >= desiredWidth;
        let x;
        if (leftFits && rightFits) x = "left";
        else if (leftFits) x = "left";
        else if (rightFits) x = "right";
        else x = leftSpace >= rightSpace ? "left" : "right";
        const availableWidth = x === "left" ? leftSpace : rightSpace;
        const downSpace = Math.max(0, stageHeight - anchor.y - panelHeaderHeight - bodySafe);
        const upSpace = Math.max(0, anchor.y - bodySafe);
        const y = downSpace < desiredHeight && upSpace > downSpace ? "up" : "down";
        const availableHeight = y === "up" ? upSpace : downSpace;
        return {
          x,
          y,
          width:fitAvailableDimension(desiredWidth, availableWidth, panelBodyMinAvailableWidth, panelBodyMaxWidth),
          height:fitAvailableDimension(desiredHeight, availableHeight, panelBodyMinAvailableHeight, panelBodyMaxHeight),
        };
      };
      const layoutPanel = (panel) => {
        const placement = choosePanelPlacement(panel);
        if (!placement) {
          if (!panel.measureRetried) {
            if (!panel.measureFrame) {
              panel.measureFrame = requestAnimationFrame(() => {
                panel.measureFrame = 0;
                if (desktopActive && panel.wrapper.isConnected && panelIsOpen(panel)) {
                  panel.measureRetried = true;
                  layoutPanel(panel);
                }
              });
            }
            return;
          }
          if (!panel.measureWarned) {
            panel.measureWarned = true;
            console.warn("[desktop-panels] panel body measurement failed", panel.id);
          }
          return;
        }
        if (panel.measureFrame) cancelAnimationFrame(panel.measureFrame);
        panel.measureFrame = 0;
        panel.measureRetried = false;
        panel.measureWarned = false;
        panel.wrapper.dataset.codexPanelX = placement.x;
        panel.wrapper.dataset.codexPanelY = placement.y;
        panel.wrapper.style.setProperty("--codex-panel-body-width", `${Math.round(placement.width)}px`);
        panel.wrapper.style.setProperty("--codex-panel-body-height", `${Math.round(placement.height)}px`);
      };
      const assertPanelManaged = (panel) => {
        const { wrapper, header, body } = panel;
        wrapper.dataset.codexDesktopPanel = "1";
        header.dataset.codexPanelHeader = "1";
        body.dataset.codexPanelBody = "1";
        wrapper.dataset.codexPanelDragging = panel.drag?.active ? "1" : "0";
        if (wrapper.dataset.moved !== "1") wrapper.dataset.moved = "1";
      };
      const syncPanel = (panel) => {
        if (!desktopActive) return;
        assertPanelManaged(panel);
        const defaults = getDefaultAnchors();
        applyAnchor(panel, panel.anchor || defaults[panel.index]);
        applyPanelLayer(panel);
        const open = panelIsOpen(panel);
        panel.wrapper.dataset.codexPanelOpen = open ? "1" : "0";
        panel.toggle.setAttribute("aria-expanded", open ? "true" : "false");
        panel.toggle.textContent = open ? "收起" : "展开";
        layoutPanel(panel);
      };
      const applyPanelLayer = (panel) => {
        panel.wrapper.style.setProperty("--codex-panel-z", String(panel.zIndex));
      };
      const promotePanel = (panel) => {
        if (!desktopActive) return;
        desktopPanels.forEach((candidate) => {
          candidate.zIndex = candidate === panel ? 36 : 30;
          applyPanelLayer(candidate);
        });
      };
      const preservePanelAudioUnlock = (panel) => {
        const panelId = panel.id;
        try {
          const labAudio = window.labAudio;
          if (!labAudio || labAudio.unlocked === true) return;
          let result;
          if (typeof labAudio.unlock === "function") result = labAudio.unlock();
          else if (typeof labAudio.resume === "function") result = labAudio.resume();
          else if (typeof labAudio.play === "function") result = labAudio.play("tap");
          if (result && typeof result.catch === "function") {
            result.catch((error) => {
              console.warn("[desktop-panels] audio unlock failed for panel", panelId, error);
            });
          }
        } catch (error) {
          console.warn("[desktop-panels] audio unlock failed for panel", panelId, error);
        }
      };
      const releasePanelPointer = (panel, pointerId) => {
        try {
          if (!panel.header.hasPointerCapture || panel.header.hasPointerCapture(pointerId)) {
            panel.header.releasePointerCapture(pointerId);
          }
        } catch (error) {
          console.warn("[desktop-panels] pointer release failed for panel", panel.id, error);
        }
      };
      const cancelPanelDrag = (panel) => {
        const drag = panel.drag;
        if (!drag) {
          if (desktopActive) setPanelDragging(panel, false);
          return;
        }
        try {
          releasePanelPointer(panel, drag.pointerId);
        } finally {
          panel.drag = null;
          if (desktopActive) setPanelDragging(panel, false);
        }
      };
      const bindPanelListener = (target, type, listener, options) => {
        target.addEventListener(type, listener, options);
        panelCleanupCallbacks.push(() => target.removeEventListener(type, listener, options));
      };
      const snapshotPanelToggleTransaction = (transaction, status) => transaction ? {
        generation:transaction.generation,
        sourceId:transaction.sourceId,
        panelWasOpen:transaction.panelWasOpen,
        peerWasOpen:transaction.peerWasOpen,
        targets:{ ...transaction.targets },
        applications:transaction.applications,
        lastReason:transaction.lastReason,
        status,
      } : null;
      const clearPanelToggleHandles = () => {
        if (panelToggleFrame) cancelAnimationFrame(panelToggleFrame);
        if (panelToggleTimer) clearTimeout(panelToggleTimer);
        panelToggleFrame = 0;
        panelToggleTimer = 0;
      };
      const cancelPanelToggleTransaction = (reason = "cancelled") => {
        panelToggleGeneration += 1;
        if (panelToggleTransaction) {
          panelLastTransaction = snapshotPanelToggleTransaction(panelToggleTransaction, reason);
        }
        clearPanelToggleHandles();
        panelToggleTransaction = null;
        return panelToggleGeneration;
      };
      const applyPanelToggleTransaction = (generation, reason) => {
        const transaction = panelToggleTransaction;
        if (!desktopActive || !transaction || transaction.generation !== generation || panelToggleGeneration !== generation) return false;
        desktopPanels.forEach((candidate) => {
          if (Object.prototype.hasOwnProperty.call(transaction.targets, candidate.id)) {
            setPanelOpen(candidate, transaction.targets[candidate.id]);
          }
        });
        desktopPanels.forEach(syncPanel);
        transaction.applications += 1;
        transaction.lastReason = reason;
        return true;
      };
      const schedulePanelToggleTransaction = (generation, reason) => {
        if (!desktopActive || !panelToggleTransaction || panelToggleTransaction.generation !== generation || panelToggleGeneration !== generation) return;
        if (panelToggleFrame) return;
        panelToggleFrame = requestAnimationFrame(() => {
          panelToggleFrame = 0;
          if (panelToggleGeneration !== generation || panelToggleTransaction?.generation !== generation) return;
          applyPanelToggleTransaction(generation, reason);
        });
      };
      const beginPanelToggleTransaction = (panel) => {
        if (panelToggleTransaction) {
          panelLastTransaction = snapshotPanelToggleTransaction(panelToggleTransaction, "superseded");
        }
        clearPanelToggleHandles();
        const generation = ++panelToggleGeneration;
        const peer = desktopPanels.find((candidate) => candidate !== panel) || null;
        const panelWasOpen = panelIsOpen(panel);
        const peerWasOpen = peer ? panelIsOpen(peer) : false;
        panelToggleTransaction = {
          generation,
          sourceId:panel.id,
          panelWasOpen,
          peerWasOpen,
          targets:{
            [panel.id]:!panelWasOpen,
            ...(peer ? { [peer.id]:peerWasOpen } : {}),
          },
          applications:0,
          lastReason:"captured",
        };
        panelToggleTimer = setTimeout(() => {
          panelToggleTimer = 0;
          if (panelToggleGeneration !== generation || panelToggleTransaction?.generation !== generation) return;
          applyPanelToggleTransaction(generation, "settle-expiry");
          panelLastTransaction = snapshotPanelToggleTransaction(panelToggleTransaction, "committed");
          panelToggleTransaction = null;
        }, panelToggleSettleMs);
        return generation;
      };
      const panelToggleDebugSnapshot = () => ({
        generation:panelToggleGeneration,
        settleMs:panelToggleSettleMs,
        pending:Number(Boolean(panelToggleFrame)) + Number(Boolean(panelToggleTimer)),
        active:desktopActive,
        current:snapshotPanelToggleTransaction(panelToggleTransaction, "active"),
        last:panelLastTransaction ? { ...panelLastTransaction, targets:{ ...panelLastTransaction.targets } } : null,
      });
      const bindPanelDrag = (panel) => {
        const { wrapper, header, toggle } = panel;
        const onWrapperPointerDown = (event) => {
          if (!desktopActive) return;
          if (toggle.contains(event.target)) wrapper.dataset.moved = "1";
          promotePanel(panel);
        };
        const onWrapperClick = () => promotePanel(panel);
        const onToggleClickCapture = () => {
          if (!desktopActive) return;
          beginPanelToggleTransaction(panel);
        };
        const onToggleClick = () => {
          const generation = panelToggleTransaction?.generation;
          if (!desktopActive || !generation || panelToggleTransaction.sourceId !== panel.id) return;
          schedulePanelToggleTransaction(generation, "click-bubble");
        };
        const onHeaderPointerDown = (event) => {
          if (!desktopActive || event.target.closest?.("button")) return;
          if (event.button !== undefined && event.button !== 0) return;
          preservePanelAudioUnlock(panel);
          event.stopImmediatePropagation();
          event.preventDefault();
          const wrapperRect = wrapper.getBoundingClientRect();
          panel.drag = {
            pointerId:event.pointerId,
            startX:event.clientX,
            startY:event.clientY,
            offsetX:event.clientX - wrapperRect.left,
            offsetY:event.clientY - wrapperRect.top,
            active:false,
          };
          promotePanel(panel);
          try {
            header.setPointerCapture(event.pointerId);
          } catch (error) {
            console.warn("[desktop-panels] pointer capture failed for panel", panel.id, error);
            panel.drag = null;
            setPanelDragging(panel, false);
          }
        };
        const onHeaderPointerMove = (event) => {
          const drag = panel.drag;
          if (!drag || event.pointerId !== drag.pointerId) return;
          event.stopImmediatePropagation();
          if (!drag.active && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 4) return;
          drag.active = true;
          setPanelDragging(panel, true);
          const stageRect = stage.getBoundingClientRect();
          applyAnchor(panel, {
            x:event.clientX - stageRect.left - drag.offsetX,
            y:event.clientY - stageRect.top - drag.offsetY,
          });
          layoutPanel(panel);
          event.preventDefault();
        };
        const finishDrag = (event) => {
          const drag = panel.drag;
          if (!drag || event.pointerId !== drag.pointerId) return;
          event.stopImmediatePropagation();
          try {
            releasePanelPointer(panel, event.pointerId);
          } finally {
            panel.drag = null;
            if (desktopActive) {
              setPanelDragging(panel, false);
              layoutPanel(panel);
            }
          }
        };
        const onLostPointerCapture = (event) => {
          if (!panel.drag || event.pointerId !== panel.drag.pointerId) return;
          panel.drag = null;
          if (desktopActive) setPanelDragging(panel, false);
        };
        bindPanelListener(wrapper, "pointerdown", onWrapperPointerDown, true);
        bindPanelListener(wrapper, "click", onWrapperClick, true);
        bindPanelListener(toggle, "click", onToggleClickCapture, true);
        bindPanelListener(toggle, "click", onToggleClick);
        bindPanelListener(header, "pointerdown", onHeaderPointerDown, true);
        bindPanelListener(header, "pointermove", onHeaderPointerMove, true);
        bindPanelListener(header, "pointerup", finishDrag, true);
        bindPanelListener(header, "pointercancel", finishDrag, true);
        bindPanelListener(header, "lostpointercapture", onLostPointerCapture, true);
      };
      const cancelPanelFrames = (panel) => {
        if (panel.measureFrame) cancelAnimationFrame(panel.measureFrame);
        panel.measureFrame = 0;
        panel.measureRetried = false;
        panel.measureWarned = false;
      };
      const resetDesktopPanels = (cancelTransaction = true) => {
        if (!desktopActive) return;
        if (cancelTransaction) cancelPanelToggleTransaction("reset");
        const anchors = getDefaultAnchors();
        desktopPanels.forEach((panel, index) => {
          cancelPanelDrag(panel);
          cancelPanelFrames(panel);
          setPanelOpen(panel, false);
          panel.zIndex = index === 0 ? 36 : 30;
          applyAnchor(panel, anchors[index]);
          applyPanelLayer(panel);
          syncPanel(panel);
        });
      };
      const rememberPanelMoved = (panel) => {
        panel.originalMoved = {
          present:panel.wrapper.hasAttribute("data-moved"),
          value:panel.wrapper.getAttribute("data-moved"),
        };
      };
      const activateDesktopPanels = () => {
        desktopActive = true;
        desktopPanels.forEach((panel) => {
          rememberPanelMoved(panel);
          const { wrapper, header, body } = panel;
          wrapper.dataset.codexDesktopPanel = "1";
          header.dataset.codexPanelHeader = "1";
          body.dataset.codexPanelBody = "1";
          wrapper.dataset.codexPanelOpen = panelIsOpen(panel) ? "1" : "0";
          wrapper.dataset.codexPanelDragging = "0";
          wrapper.dataset.moved = "1";
        });
        if (!desktopInitialized) {
          desktopInitialized = true;
          resetDesktopPanels();
          return;
        }
        const defaults = getDefaultAnchors();
        desktopPanels.forEach((panel, index) => {
          applyAnchor(panel, panel.anchor || defaults[index]);
          applyPanelLayer(panel);
          syncPanel(panel);
        });
      };
      const deactivateDesktopPanels = () => {
        if (!desktopActive) return;
        cancelPanelToggleTransaction("deactivate");
        desktopPanels.forEach((panel) => {
          cancelPanelDrag(panel);
          cancelPanelFrames(panel);
          const { wrapper, header, body, originalMoved } = panel;
          delete wrapper.dataset.codexDesktopPanel;
          delete header.dataset.codexPanelHeader;
          delete body.dataset.codexPanelBody;
          delete wrapper.dataset.codexPanelOpen;
          delete wrapper.dataset.codexPanelDragging;
          delete wrapper.dataset.codexPanelX;
          delete wrapper.dataset.codexPanelY;
          wrapper.style.removeProperty("--codex-panel-body-width");
          wrapper.style.removeProperty("--codex-panel-body-height");
          wrapper.style.removeProperty("--codex-panel-left");
          wrapper.style.removeProperty("--codex-panel-top");
          wrapper.style.removeProperty("--codex-panel-z");
          if (originalMoved.present) wrapper.setAttribute("data-moved", originalMoved.value ?? "");
          else wrapper.removeAttribute("data-moved");
        });
        desktopActive = false;
      };
      const syncDesktopPanelMode = () => {
        const { width } = getStageSize();
        if (!width) return;
        if (width <= desktopBreakpoint) {
          deactivateDesktopPanels();
          return;
        }
        if (!desktopActive) {
          activateDesktopPanels();
          return;
        }
        desktopPanels.forEach((panel) => {
          applyAnchor(panel, panel.anchor);
          applyPanelLayer(panel);
          syncPanel(panel);
        });
      };
      const queuePanelSync = (records = []) => {
        const transaction = panelToggleTransaction;
        const panelClassChanged = records.some((record) => record.type === "attributes" && record.attributeName === "class");
        if (desktopActive && transaction && panelClassChanged) {
          schedulePanelToggleTransaction(transaction.generation, "class-mutation");
          return;
        }
        if (!desktopActive || panelMutationFrame) return;
        const generation = panelToggleGeneration;
        panelMutationFrame = requestAnimationFrame(() => {
          panelMutationFrame = 0;
          if (!desktopActive || generation !== panelToggleGeneration) return;
          desktopPanels.forEach(syncPanel);
        });
      };
      const schedulePanelResize = () => {
        clearTimeout(panelResizeTimer);
        panelResizeTimer = setTimeout(syncDesktopPanelMode, 120);
      };
      const isResetIntent = (button) => button.textContent.includes("重置");
      const managedPanelNodesConnected = () => stage?.isConnected && desktopPanels.every((panel) =>
        [panel.wrapper, panel.header, panel.body, panel.toggle].every((node) => node.isConnected));
      const teardownDesktopPanels = () => {
        cancelPanelToggleTransaction("disconnect");
        clearTimeout(panelResizeTimer);
        panelResizeTimer = 0;
        if (panelMutationFrame) cancelAnimationFrame(panelMutationFrame);
        panelMutationFrame = 0;
        if (desktopActive) deactivateDesktopPanels();
        else desktopPanels.forEach((panel) => {
          cancelPanelDrag(panel);
          cancelPanelFrames(panel);
        });
        if (mutationObserver) mutationObserver.disconnect();
        if (resizeObserver) resizeObserver.disconnect();
        if (lifecycleObserver) lifecycleObserver.disconnect();
        mutationObserver = null;
        resizeObserver = null;
        lifecycleObserver = null;
        panelCleanupCallbacks.splice(0).reverse().forEach((cleanup) => cleanup());
        desktopPanels = [];
      };
      const installDesktopPanels = () => {
        if (panelCoordinatorInstalled) return;
        panelCoordinatorInstalled = true;
        const resolved = resolveDesktopPanels();
        if (!resolved) return;
        desktopPanels = resolved;
        desktopPanels.forEach(bindPanelDrag);
        mutationObserver = new MutationObserver(queuePanelSync);
        desktopPanels.forEach((panel) => {
          mutationObserver.observe(panel.wrapper, {
            attributes:true,
            attributeFilter:["class", "data-moved"],
          });
          mutationObserver.observe(panel.body, {
            attributes:true,
            attributeFilter:["class"],
          });
        });
        bindPanelListener(window, "resize", schedulePanelResize);
        if ("ResizeObserver" in window) {
          resizeObserver = new ResizeObserver(schedulePanelResize);
          resizeObserver.observe(stage);
        }
        lifecycleObserver = new MutationObserver(() => {
          if (!managedPanelNodesConnected()) teardownDesktopPanels();
        });
        lifecycleObserver.observe(document.documentElement, { childList:true, subtree:true });
        const resetButtons = document.querySelectorAll("#resetBtn");
        if (resetButtons.length === 1) {
          const resetButton = document.getElementById("resetBtn");
          const onResetClick = () => {
            if (!isResetIntent(resetButton)) return;
            const generation = cancelPanelToggleTransaction("reset-requested");
            requestAnimationFrame(() => {
              if (panelToggleGeneration !== generation) return;
              resetDesktopPanels(false);
            });
          };
          bindPanelListener(resetButton, "click", onResetClick, true);
        } else {
          console.warn("[desktop-panels] expected one reset button", "resetBtn");
        }
        window.__codexDesktopPanels = Object.freeze({ version:panelStandardVersion, getTransactionState:panelToggleDebugSnapshot });
        syncDesktopPanelMode();
      };
      const isolateThemePointer = (event) => {
        if (button.contains(event.target)) event.stopPropagation();
      };
      window.addEventListener("pointerdown", isolateThemePointer, true);
      window.addEventListener("mousedown", isolateThemePointer, true);
      window.addEventListener("touchstart", isolateThemePointer, { capture:true, passive:true });
      window.addEventListener("click", (event) => {
        if (!button.contains(event.target)) return;
        event.stopPropagation();
        applyTheme(root.dataset.theme === "light" ? "dark" : "light", true);
      }, true);
      window.addEventListener("storage", (event) => {
        if (event.key === themeKey) applyTheme(event.newValue, false);
      });
      applyTheme(root.dataset.theme, false);
      installDesktopPanels();
    })();
  </script>
</body>
</html>
