<script id="codexDemoRuntimePreludeV2">(() => {
  if (window.__codexDemoClock) return;

  const native = {
    raf: window.requestAnimationFrame.bind(window),
    caf: window.cancelAnimationFrame.bind(window),
    setTimeout: window.setTimeout.bind(window),
    clearTimeout: window.clearTimeout.bind(window),
    now: () => performance.now()
  };
  const timers = new Map();
  const frames = new Map();
  let sequence = 1000000;
  let paused = false;
  let pausedAt = 0;
  let pausedDuration = 0;

  const invoke = (handler, args) => {
    if (typeof handler === "function") return handler(...args);
    return (0, eval)(String(handler));
  };

  const scheduleTimer = (entry) => {
    entry.startedAt = native.now();
    entry.nativeId = native.setTimeout(() => {
      if (!timers.has(entry.id)) return;
      if (entry.kind === "timeout") timers.delete(entry.id);
      invoke(entry.handler, entry.args);
      if (entry.kind === "interval" && timers.has(entry.id)) {
        entry.remaining = entry.delay;
        scheduleTimer(entry);
      }
    }, Math.max(0, entry.remaining));
  };

  const createTimer = (kind, handler, delay, args) => {
    const id = sequence++;
    const value = Number.isFinite(Number(delay)) ? Math.max(0, Number(delay)) : 0;
    const entry = { id, kind, handler, args, delay: value, remaining: value, startedAt: native.now(), nativeId: 0 };
    timers.set(id, entry);
    if (!paused) scheduleTimer(entry);
    return id;
  };

  window.setTimeout = (handler, delay, ...args) => createTimer("timeout", handler, delay, args);
  window.setInterval = (handler, delay, ...args) => createTimer("interval", handler, delay, args);
  window.clearTimeout = (id) => {
    const entry = timers.get(id);
    if (!entry) return native.clearTimeout(id);
    native.clearTimeout(entry.nativeId);
    timers.delete(id);
  };
  window.clearInterval = window.clearTimeout;

  window.requestAnimationFrame = (callback) => {
    const id = sequence++;
    const tick = (timestamp) => {
      if (!frames.has(id)) return;
      if (paused) {
        frames.get(id).nativeId = native.raf(tick);
        return;
      }
      frames.delete(id);
      callback(timestamp - pausedDuration);
    };
    const entry = { id, nativeId: native.raf(tick) };
    frames.set(id, entry);
    return id;
  };
  window.cancelAnimationFrame = (id) => {
    const entry = frames.get(id);
    if (!entry) return native.caf(id);
    native.caf(entry.nativeId);
    frames.delete(id);
  };

  window.__codexDemoClock = {
    get paused() { return paused; },
    pause() {
      if (paused) return;
      paused = true;
      pausedAt = native.now();
      for (const entry of timers.values()) {
        native.clearTimeout(entry.nativeId);
        entry.remaining = Math.max(0, entry.remaining - (pausedAt - entry.startedAt));
      }
      document.documentElement.classList.add("codex-demo-paused");
    },
    resume() {
      if (!paused) return;
      const now = native.now();
      pausedDuration += now - pausedAt;
      paused = false;
      for (const entry of timers.values()) scheduleTimer(entry);
      document.documentElement.classList.remove("codex-demo-paused");
    },
    nativeSetTimeout: native.setTimeout,
    nativeClearTimeout: native.clearTimeout
  };
})();
</script>

<body>
<main id="app">
  <div id="spectrum" aria-hidden="true"></div>
  <section class="task-card codex-auto-task" aria-label="学习任务"><div class="task-step">观察</div><div class="task-text"><div>拖动画面观察银河系旋臂，找到太阳系所在位置。</div><div class="task-hint">可在实验面板调整缩放和旋转速度。</div></div><div class="progress-dots"><span class="dot active"></span></div></section>
<div id="info">银河系结构 · 太阳系位于猎户臂内侧</div>

<div class="controls" aria-label="银河系观察控制">
  <label>缩放 <input id="galaxyZoom" type="range" min="0.65" max="1.55" step="0.05" value="1"></label>
  <label>旋转速度 <input id="galaxySpeed" type="range" min="0" max="0.004" step="0.0005" value="0.001"></label>
  <button id="galaxyResetView" type="button">重置视角</button>
</div>

<script>
if (false) {
/**
 * 简要说明：
 * 1. 创建一个场景 scene。
 * 2. 添加一个相机 camera，并将其放在某个距离处，以便可以看到整个“银河系”。
 * 3. 创建渲染器并将其添加到文档中。
 * 4. 使用点云 (Points) 来模拟银河系星点以及星团。
 * 5. 添加一个小球用来标记“太阳系”位置，并配合文字标签。
 * 6. 在 render/animate 循环中执行场景的缓慢自转动画。
 */

// ----- 1. 创建场景，摄像机，渲染器 -----
const scene = new THREE.Scene();

// 透视摄像机（视野角度，宽高比，近截面，远截面）
const camera = new THREE.PerspectiveCamera(
  60, // 视野角度 (FOV)
  window.innerWidth / window.innerHeight, // 宽高比
  0.1, // 近截面
  10000 // 远截面
);
camera.position.set(0, 200, 800); // 将相机放远一些，便于看到整个模型

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 如果浏览器成功加载 CSS2DRenderer，则使用 3D 标签；否则降级为普通页面标签。
const hasCss2DRenderer = typeof THREE.CSS2DRenderer === 'function' && typeof THREE.CSS2DObject === 'function';
const labelRenderer = hasCss2DRenderer ? new THREE.CSS2DRenderer() : null;
if (labelRenderer) {
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  document.body.appendChild(labelRenderer.domElement);
}

// ----- 2. 创建一个星系组，用于承载所有星点和星团 -----
const galaxyGroup = new THREE.Group();
scene.add(galaxyGroup);

// ----- 3. 创建点云来模拟银河系的星点 -----

// 配置星系（越大越逼真，但消耗也越大）
const ARM_COUNT = 4;            // 银河系一般有 4 条主要旋臂，这里可自行调节
const STARS_COUNT = 3000;       // 星点总数
const GALAXY_RADIUS = 500;      // 星系半径

const starGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(STARS_COUNT * 3); // x, y, z

function generateSpiralArms() {
  // 简单生成模拟旋臂数据
  for (let i = 0; i < STARS_COUNT; i++) {
    // 计算星点所在的旋臂
    const armIndex = i % ARM_COUNT;
    const armAngle = (armIndex / ARM_COUNT) * (Math.PI * 2);

    // 让星点在“半径范围”内随机分布
    const radius = Math.random() * GALAXY_RADIUS;
    // 让旋臂稍微带点“螺旋”，每个星点基于自身半径位置再增加一定角度
    const spinAngle = radius * 0.02; // 控制螺旋扭曲的幅度

    // 星点最终角度 = 该旋臂的起始角度 + 本身的螺旋 + 一点随机
    const totalAngle = armAngle + spinAngle + (Math.random() - 0.5) * 0.3;

    // 将极坐标转换为 xyz
    const x = Math.cos(totalAngle) * radius;
    const y = (Math.random() - 0.5) * 20; // 略微随机的高度
    const z = Math.sin(totalAngle) * radius;

    positions[i * 3 + 0] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
  }
}
generateSpiralArms();

starGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(positions, 3)
);

const starMaterial = new THREE.PointsMaterial({
  color: 0xffffff,  // 白色星点
  size: 2,          // 星点大小
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.8
});

const starsPoints = new THREE.Points(starGeometry, starMaterial);
galaxyGroup.add(starsPoints);

// ----- 4. 添加一些“星团”，用来模拟银河系中的大星团 -----
function createCluster(radius = 50, count = 300, color = 0xffaa00) {
  count = Math.max(1, Math.floor(count));
  const clusterGeometry = new THREE.BufferGeometry();
  const clusterPositions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    // 在给定半径内随机分布
    const r = Math.random() * radius;
    const theta = Math.random() * Math.PI * 2;
    const phi = (Math.random() - 0.5) * Math.PI; // -π/2 到 π/2 之间

    const x = r * Math.cos(theta) * Math.cos(phi);
    const y = r * Math.sin(phi);
    const z = r * Math.sin(theta) * Math.cos(phi);

    clusterPositions[i * 3 + 0] = x;
    clusterPositions[i * 3 + 1] = y;
    clusterPositions[i * 3 + 2] = z;
  }

  clusterGeometry.setAttribute(
    'position',
    new THREE.BufferAttribute(clusterPositions, 3)
  );

  const clusterMaterial = new THREE.PointsMaterial({
    color: color,
    size: 3,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.9
  });

  const clusterPoints = new THREE.Points(clusterGeometry, clusterMaterial);
  return clusterPoints;
}

// 随机放置几个星团在银河系里
for (let i = 0; i < 3; i++) {
  const cluster = createCluster(30 + Math.random() * 30, 200 + Math.random() * 200);
  // 星团随机坐标，保证在银河系半径之内
  cluster.position.x = (Math.random() - 0.5) * GALAXY_RADIUS * 1.6;
  cluster.position.y = (Math.random() - 0.5) * 50;
  cluster.position.z = (Math.random() - 0.5) * GALAXY_RADIUS * 1.6;
  galaxyGroup.add(cluster);
}

// ----- 5. 标注太阳系位置 -----
const solarSystemRadius = 5; // 太阳系标记可稍大一些以便于看清
const solarSystemGeometry = new THREE.SphereGeometry(solarSystemRadius, 16, 16);
const solarSystemMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
const solarSystemMesh = new THREE.Mesh(solarSystemGeometry, solarSystemMaterial);

// 设定太阳系坐标（在银河系中心附近，但不是绝对中心）
solarSystemMesh.position.set(30, 0, 0);
galaxyGroup.add(solarSystemMesh);

// 文字标签
const solarSystemDiv = document.createElement('div');
solarSystemDiv.className = 'label';
solarSystemDiv.textContent = '太阳系';
solarSystemDiv.style.color = '#ff0000';
solarSystemDiv.style.fontSize = '14px';

if (hasCss2DRenderer) {
  const solarSystemLabel = new THREE.CSS2DObject(solarSystemDiv);
  solarSystemLabel.position.set(0, solarSystemRadius + 10, 0);
  solarSystemMesh.add(solarSystemLabel);
} else {
  solarSystemDiv.style.position = 'absolute';
  solarSystemDiv.style.left = '16px';
  solarSystemDiv.style.bottom = '16px';
  solarSystemDiv.style.zIndex = '2';
  document.body.appendChild(solarSystemDiv);
}

// ----- 6. 添加简单的环境光，以便能看到球体等 -----
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

// ----- 7. 自适应窗口大小 -----
window.addEventListener('resize', onWindowResize, false);
function onWindowResize() {
  const host = renderer.domElement.closest('#stage') || document.documentElement;
  const width = host.clientWidth || window.innerWidth;
  const height = host.clientHeight || window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  if (labelRenderer) labelRenderer.setSize(width, height);
}

// ----- 8. 动画循环，让星系慢慢转动 -----
function animate() {
  requestAnimationFrame(animate);

  // 慢速旋转，可根据需要调整
  galaxyGroup.rotation.y += 0.001;

  renderer.render(scene, camera);
  if (labelRenderer) labelRenderer.render(scene, camera);
}

animate();
}
</script>

<script>
(() => {
  const canvas = document.createElement('canvas');
  canvas.id = 'galaxyCanvas';
  canvas.setAttribute('aria-label', '可拖动旋转的银河系俯视图');
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d', { alpha: false });
  const zoomInput = document.getElementById('galaxyZoom');
  const speedInput = document.getElementById('galaxySpeed');
  const resetView = document.getElementById('galaxyResetView');
  const stars = [];
  let seed = 24681357;
  let width = 0;
  let height = 0;
  let dpr = 1;
  let rotation = -0.35;
  let dragging = false;
  let pointerX = 0;

  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  for (let index = 0; index < 2200; index += 1) {
    const arm = index % 4;
    const radius = Math.pow(random(), 0.72);
    const angle = arm * Math.PI / 2 + radius * Math.PI * 3.1 + (random() - 0.5) * (0.36 + radius * 0.3);
    stars.push({
      x: Math.cos(angle) * radius,
      y: Math.sin(angle) * radius,
      z: (random() - 0.5) * (0.08 + (1 - radius) * 0.11),
      size: 0.45 + random() * 1.45,
      warm: random() > 0.82
    });
  }

  function resize() {
    const host = canvas.closest('#stage') || document.documentElement;
    width = Math.max(1, host.clientWidth || window.innerWidth);
    height = Math.max(1, host.clientHeight || window.innerHeight);
    dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(now) {
    const speed = Number(speedInput.value);
    if (!dragging) rotation += speed;
    const zoom = Number(zoomInput.value);
    const radius = Math.min(width, height) * 0.43 * zoom;
    const cos = Math.cos(rotation);
    const sin = Math.sin(rotation);
    ctx.fillStyle = '#010207';
    ctx.fillRect(0, 0, width, height);

    const glow = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, radius * 1.1);
    glow.addColorStop(0, 'rgba(255,214,126,.42)');
    glow.addColorStop(.12, 'rgba(255,174,54,.2)');
    glow.addColorStop(.5, 'rgba(49,104,185,.08)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);

    for (const star of stars) {
      const rx = star.x * cos - star.y * sin;
      const ry = star.x * sin + star.y * cos;
      const x = width / 2 + rx * radius;
      const y = height / 2 + (ry * 0.38 + star.z) * radius;
      const alpha = 0.28 + (1 - Math.abs(star.z) * 5) * 0.58;
      ctx.fillStyle = star.warm ? `rgba(255,190,72,${alpha})` : `rgba(210,228,255,${alpha})`;
      ctx.fillRect(x, y, star.size, star.size);
    }

    const solarRadius = 0.58;
    const solarAngle = 1.15 + rotation;
    const sx = width / 2 + Math.cos(solarAngle) * solarRadius * radius;
    const sy = height / 2 + Math.sin(solarAngle) * solarRadius * radius * 0.38;
    ctx.beginPath();
    ctx.arc(sx, sy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4d4d';
    ctx.shadowColor = '#ff4d4d';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd9d9';
    ctx.font = '700 13px system-ui, sans-serif';
    ctx.fillText('太阳系', sx + 10, sy - 8);
    requestAnimationFrame(draw);
  }

  canvas.addEventListener('pointerdown', (event) => {
    dragging = true;
    pointerX = event.clientX;
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    rotation += (event.clientX - pointerX) * 0.008;
    pointerX = event.clientX;
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  resetView.addEventListener('click', () => {
    rotation = -0.35;
    zoomInput.value = '1';
    speedInput.value = '0.001';
  });
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>

<script id="codexDemoShellRuntimeV2">(() => {
  if (window.__codexDemoShellV2) return;
  window.__codexDemoShellV2 = true;

  const bridge = document.getElementById("codexDemoBridge");
  const app = document.getElementById("app");
  const clock = window.__codexDemoClock;
  if (!bridge || !app) return;

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const nativeDelay = (ms) => new Promise((resolve) => clock.nativeSetTimeout(resolve, ms));
  const shellState = {
    freeMode: false,
    autoPlaying: false,
    autoPaused: false,
    autoToken: 0,
    unseen: 0,
    records: [],
    drawerZ: 60
  };

  const taskCard = $(".task-card,.taskCard,.xn-stepcard", app);
  const contractStage = $("#stage.codex-contract-stage", app);
  const existingStage = $("#stage:not(.codex-contract-stage)", app);
  const stage = existingStage || contractStage;
  const hud = $(".codex-hud", bridge);
  const mobileTabs = $(".mobile-tabs", bridge);

  const dataDock = $("#codexDataDock", bridge);

  const liveGrid = $("#codexLiveData", bridge);
  const recordList = $("#codexRecordList", bridge);
  const dataEmpty = $("#codexDataEmpty", bridge);
  const modeTag = $("#modeTag", bridge);
  const statusTag = $("#statusTag", bridge);
  const experimentTab = $("#experimentTab", bridge);
  const dataTab = $("#dataTab", bridge);
  const dataNotice = $("#codexDataNotice", bridge);
  const dataTabBadge = $("#codexDataTabBadge", bridge);
  const standardToolbar = $(".codex-global-toolbar", bridge);
  const resetButton = $("#resetBtn", standardToolbar);
  const autoButton = $("#autoDemoBtn", standardToolbar);
  const freeButton = $("#freeBtn", standardToolbar);

  const visualRoots = [...document.body.children].filter((node) => node !== app && node !== bridge && !["SCRIPT", "STYLE"].includes(node.tagName));
  visualRoots.forEach((node) => app.insertBefore(node, bridge));

  const isBridgeNode = (node) => Boolean(node && (
    node === bridge ||
    node.closest?.('.codex-hud,.mobile-tabs,.codex-drawer,.codex-global-toolbar,.codex-generated-explanation')
  ));
  const allButtons = $$('button', document).filter((button) => !isBridgeNode(button));
  const scoreButton = (button, kind) => {
    const text = (button.textContent || "").replace(/\s+/g, "").trim();
    const id = (button.id || "").toLowerCase();
    const className = String(button.className || "").toLowerCase();
    let score = 0;
    if (kind === "reset") {
      if (id === "resetbtn") score += 100;
      if (/stepreset|resetall|xnreset/.test(id)) score += 75;
      if (/步骤重置|重置关卡/.test(text)) score += 65;
      else if (/全部重置|重置|复位|重新来/.test(text)) score += 28;
    }
    if (kind === "auto") {
      if (id === "autodemobtn") score += 100;
      if (/autodemo|xnauto/.test(id)) score += 75;
      if (/自动演示|演示模式/.test(text)) score += 65;
    }
    if (kind === "free") {
      if (id === "freebtn") score += 100;
      if (/xnfree|freemode/.test(id + className)) score += 75;
      if (/自由模式/.test(text)) score += 65;
    }
    if (button.closest('.toolbar,.toolbar-bottom,.xn-toolbar')) score += 10;
    return score;
  };
  const findLegacyButton = (kind) => allButtons
    .map((button) => ({ button, score: scoreButton(button, kind) }))
    .filter((entry) => entry.score > 0)
    .sort((a, b) => b.score - a.score)[0]?.button || null;

  const legacy = {
    reset: findLegacyButton("reset"),
    auto: findLegacyButton("auto"),
    free: findLegacyButton("free")
  };

  Object.entries(legacy).forEach(([kind, button]) => {
    if (!button) return;
    if (["resetBtn", "autoDemoBtn", "freeBtn"].includes(button.id)) button.id = `codexLegacy${kind[0].toUpperCase()}${kind.slice(1)}Btn`;
    const toolbar = button.closest('.toolbar,.toolbar-bottom,.xn-toolbar');
    if (toolbar && toolbar !== standardToolbar) toolbar.classList.add('codex-legacy-toolbar');
  });

  const findStageCandidate = () => {
    const selectors = [
      '#stageWrap', '.stageWrap', '.stage-wrap', '#canvasWrap', '.canvasWrap', '.canvas-wrap',
      '.sceneWrap', '.scene-wrap', '#scene-container', '.scene-container', '.simulation-area', '.simulation-container',
      '.simulation', '.simFrame', '.river', '#canvas', 'canvas'
    ];
    const candidates = selectors.flatMap((selector) => $$(selector, document));
    return candidates.find((candidate) => {
      if (isBridgeNode(candidate) || candidate === stage || candidate.closest('.task-card,.toolbar,.explanation')) return false;
      if (candidate.tagName === 'CANVAS') return true;
      const rect = candidate.getBoundingClientRect();
      return rect.width > 220 && rect.height > 180;
    }) || null;
  };

  if (!stage) return;
  stage.classList.add("lab-area", "codex-runtime-stage");
  let stageContent = $(".codex-stage-content", stage);
  if (!stageContent && contractStage) {
    stageContent = document.createElement("div");
    stageContent.className = "codex-stage-content";
    stage.prepend(stageContent);
  }
  if (contractStage && stageContent) {
    const candidate = findStageCandidate();
    if (candidate) {
      const sourceParent = candidate.parentElement;
      if (candidate.tagName === "CANVAS") {
        stageContent.append(candidate);
        visualRoots
          .filter((node) => node !== candidate && !isBridgeNode(node) && (node.tagName === "CANVAS" || node.tagName === "DIV" || node.classList?.contains("label")))
          .forEach((node) => stageContent.append(node));
        const infoOverlay = $("#info", app);
        if (infoOverlay && !infoOverlay.closest(".task-card,.explanation")) stageContent.append(infoOverlay);
      } else {
        stageContent.append(candidate);
      }
      if (sourceParent && sourceParent !== app && sourceParent !== stageContent && !sourceParent.children.length && !sourceParent.textContent.trim()) {
        sourceParent.hidden = true;
      }
    }
  }

  stage.append(hud, controlDock, dataDock, mobileTabs);
  stage.insertAdjacentElement("afterend", standardToolbar);
  const generatedExplanation = $(".codex-generated-explanation", bridge);
  const existingExplanation = $(".explanation:not(.codex-generated-explanation),.explain", app);
  if (existingExplanation) {
    generatedExplanation.hidden = true;
    existingExplanation.classList.add("explanation");
    const rawTitle = (document.title || "物理科普演示").split(/[｜|—-]/)[0].trim();
    const heading = $("h2,h3", existingExplanation);
    if (heading && !heading.textContent.trim().startsWith("实验名：")) heading.textContent = `实验名：${rawTitle}`;
    standardToolbar.insertAdjacentElement("afterend", existingExplanation);
  }
  else {
    generatedExplanation.hidden = false;
    const rawTitle = (document.title || "物理科普演示").split(/[｜|—-]/)[0].trim();
    $("h2", generatedExplanation).textContent = `实验名：${rawTitle}`;
    standardToolbar.insertAdjacentElement("afterend", generatedExplanation);
  }

  const controlSelectors = [
    '.control-panel', '.controls-panel', '.controlPanel', '.control-deck', '.ctrl-panel', '.slider-panel',
    '.controls-overlay', '.canvas-controls', '.inline-controls', '.in-controls', '.in-canvas-controls', '.in-canvas', '.incanvas', '.inPanel', '.panelLeft',
    '.free-panel', '.legacy-controls', '.sensebar', '.ctrlbar', '.choice-bar', '#controls', '.panel', '.controls'
  ];
  const controlCandidates = [...new Set(controlSelectors.flatMap((selector) => $$(selector, app)))].filter((node) => {
    if (isBridgeNode(node) || node.closest('.task-card,.toolbar,.explanation,.modal,.modal-mask')) return false;
    if (!node.querySelector('button,input,select')) return false;
    if (node.querySelector('canvas')) return false;
    return !controlCandidatesContainsStage(node);
  });

  function controlCandidatesContainsStage(node) {
    return node === stage || node.contains(stage);
  }

  const managedControls = controlCandidates.filter((node) => !controlCandidates.some((other) => other !== node && other.contains(node)));
  managedControls.slice(0, 5).forEach((node) => {
    const companion = node.nextElementSibling?.matches('.tip,.choice-tip') ? node.nextElementSibling : null;
    node.classList.add("codex-managed-control");
    controlBody.append(node);
    if (companion) {
      companion.classList.add("codex-control-note");
      controlBody.append(companion);
    }
  });
  if (!managedControls.length) {
    const directNote = document.createElement("div");
    directNote.className = "codex-control-note";
    directNote.textContent = "本演示以场景直接操作为主，请在画面中拖动、点击或观察变化。";
    controlBody.append(directNote);
  }

  const setStatus = (text) => { statusTag.textContent = `状态：${text}`; };
  const syncMode = () => {
    if (shellState.autoPlaying) modeTag.textContent = `模式：演示模式${shellState.autoPaused ? " · 已暂停" : " · 自动运行"}`;
    else if (shellState.freeMode) modeTag.textContent = "模式：自由模式 · 自主探索";
    else modeTag.textContent = "模式：闯关模式";
    if (!shellState.autoPlaying && !shellState.freeMode) setStatus("待操作");
    resetButton.textContent = shellState.autoPlaying ? (shellState.autoPaused ? "继续演示" : "暂停演示") : (shellState.freeMode ? "重置操作" : "重置关卡");
    autoButton.textContent = shellState.autoPlaying ? "退出演示" : "演示模式";
    autoButton.disabled = shellState.freeMode && !shellState.autoPlaying;
    freeButton.disabled = shellState.autoPlaying;
    freeButton.textContent = shellState.freeMode ? "退出自由模式" : "自由模式";
    freeButton.setAttribute("aria-pressed", String(shellState.freeMode));
    if (taskCard) {
      taskCard.classList.toggle("free-mode", shellState.freeMode);
      taskCard.dataset.mode = shellState.freeMode ? "free" : "challenge";
      taskCard.setAttribute("aria-label", shellState.freeMode ? "关卡参考，自由模式不进行步骤判定" : "当前实验关卡");
    }
  };

  const safeClick = (button) => {
    if (!button) return false;
    const disabled = button.disabled;
    button.disabled = false;
    button.click();
    if (disabled) clock.nativeSetTimeout(() => { if (!shellState.autoPlaying) button.disabled = disabled; }, 0);
    return true;
  };

  const updateBadges = () => {
    const show = shellState.unseen > 0 && dataDock.classList.contains("collapsed");
    [dataNotice, dataTabBadge].forEach((badge) => {
      badge.textContent = shellState.unseen > 99 ? "99+" : String(shellState.unseen);
      badge.classList.toggle("show", show);
    });
    dataTab.setAttribute("aria-label", show ? `数据面板，${shellState.unseen} 条未读记录` : "数据面板");
  };

  const setDrawerCollapsed = (drawer, collapsed) => {
    const other = drawer === controlDock ? dataDock : controlDock;
    if (matchMedia("(max-width: 720px)").matches && !collapsed) other.classList.add("collapsed");
    drawer.classList.toggle("collapsed", collapsed);
    const expanded = !collapsed;
    const toggle = $(".codex-panel-toggle", drawer);
    toggle?.setAttribute("aria-expanded", String(expanded));
    toggle?.setAttribute("aria-label", expanded ? `收起${drawer.dataset.kind === "data" ? "数据" : "实验"}面板` : `展开${drawer.dataset.kind === "data" ? "数据" : "实验"}面板`);
    experimentTab.classList.toggle("active", !controlDock.classList.contains("collapsed"));
    dataTab.classList.toggle("active", !dataDock.classList.contains("collapsed"));
    experimentTab.setAttribute("aria-expanded", String(!controlDock.classList.contains("collapsed")));
    dataTab.setAttribute("aria-expanded", String(!dataDock.classList.contains("collapsed")));
    mobileTabs.classList.toggle("attached", !controlDock.classList.contains("collapsed") || !dataDock.classList.contains("collapsed"));
    if (drawer === dataDock && expanded) shellState.unseen = 0;
    updateBadges();
  };

  $$(".codex-panel-toggle", bridge).forEach((button) => button.addEventListener("click", () => {
    const drawer = button.closest(".codex-drawer");
    setDrawerCollapsed(drawer, !drawer.classList.contains("collapsed"));
  }));
  experimentTab.addEventListener("click", () => setDrawerCollapsed(controlDock, !controlDock.classList.contains("collapsed")));
  dataTab.addEventListener("click", () => setDrawerCollapsed(dataDock, !dataDock.classList.contains("collapsed")));

  const bringToFront = (drawer) => {
    shellState.drawerZ += 1;
    [controlDock, dataDock].forEach((item) => item.classList.toggle("is-front", item === drawer));
    drawer.style.zIndex = String(shellState.drawerZ);
  };
  [controlDock, dataDock].forEach((drawer) => {
    const header = $(".codex-drawer-header", drawer);
    drawer.addEventListener("pointerdown", () => bringToFront(drawer));
    header.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button") || matchMedia("(max-width: 720px)").matches) return;
      const stageRect = stage.getBoundingClientRect();
      const drawerRect = drawer.getBoundingClientRect();
      const offsetX = event.clientX - drawerRect.left;
      const offsetY = event.clientY - drawerRect.top;
      bringToFront(drawer);
      drawer.classList.add("is-dragging");
      header.setPointerCapture(event.pointerId);
      const move = (moveEvent) => {
        const maxLeft = Math.max(0, stageRect.width - drawer.offsetWidth);
        const maxTop = Math.max(0, stageRect.height - drawer.offsetHeight);
        const left = Math.max(0, Math.min(maxLeft, moveEvent.clientX - stageRect.left - offsetX));
        const top = Math.max(0, Math.min(maxTop, moveEvent.clientY - stageRect.top - offsetY));
        drawer.style.left = `${left}px`;
        drawer.style.top = `${top}px`;
        drawer.style.right = "auto";
      };
      const end = (endEvent) => {
        drawer.classList.remove("is-dragging");
        header.releasePointerCapture?.(endEvent.pointerId);
        header.removeEventListener("pointermove", move);
        header.removeEventListener("pointerup", end);
        header.removeEventListener("pointercancel", end);
      };
      header.addEventListener("pointermove", move);
      header.addEventListener("pointerup", end);
      header.addEventListener("pointercancel", end);
    });
  });

  const labelFor = (node) => {
    const explicit = node.getAttribute("aria-label") || node.getAttribute("data-label");
    if (explicit) return explicit;
    const linked = node.id && $(`label[for="${CSS.escape(node.id)}"]`);
    if (linked) return linked.textContent.replace(/\s+/g, " ").trim();
    const nearest = node.closest("label,.readout,.metric,.status-row,.info-row,.data-row");
    if (nearest) {
      const copy = nearest.cloneNode(true);
      copy.querySelectorAll("span,strong,b,output").forEach((child) => child.remove());
      const text = copy.textContent.replace(/\s+/g, " ").replace(/[:：]$/, "").trim();
      if (text) return text.slice(0, 24);
    }
    return (node.id || "观测值").replace(/(?:Value|Readout|Display|Text)$/i, "").replace(/[-_]/g, " ").slice(0, 24);
  };

  const valueFor = (node) => {
    if (node instanceof HTMLInputElement || node instanceof HTMLSelectElement) return node.value;
    return (node.value ?? node.textContent ?? "").toString().replace(/\s+/g, " ").trim();
  };

  const collectObservations = () => {
    const selector = [
      'output', 'meter', '[id*="value" i]', '[id*="readout" i]', '[id*="display" i]',
      '[id*="time" i]', '[id*="speed" i]', '[id*="pressure" i]', '[id*="temperature" i]',
      '[id*="force" i]', '[id*="frequency" i]', '[id*="height" i]', '[id*="distance" i]', '[id*="energy" i]'
    ].join(',');
    const seen = new Set();
    return $$(selector, app).filter((node) => {
      if (isBridgeNode(node) || node.closest('.task-card,.toolbar,.modal,.modal-mask')) return false;
      const value = valueFor(node);
      if (!value || value.length > 80) return false;
      const key = `${labelFor(node)}:${value}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0, 8).map((node) => ({ label: labelFor(node), value: valueFor(node) }));
  };

  const renderLiveData = () => {
    const observations = collectObservations();
    liveGrid.replaceChildren();
    observations.forEach(({ label, value }) => {
      const card = document.createElement("div");
      card.className = "codex-data-card";
      const title = document.createElement("b");
      const content = document.createElement("span");
      title.textContent = label;
      content.textContent = value;
      card.append(title, content);
      liveGrid.append(card);
    });
    dataEmpty.hidden = observations.length > 0 || shellState.records.length > 0;
  };

  const renderRecords = () => {
    recordList.replaceChildren();
    shellState.records.slice(-12).reverse().forEach((record) => {
      const item = document.createElement("div");
      item.className = "codex-record-item";
      const time = document.createElement("time");
      time.textContent = record.time;
      const text = document.createElement("span");
      text.textContent = record.text;
      item.append(time, text);
      recordList.append(item);
    });
  };

  const completionIsVisible = () => $$('.modal-mask,#doneMask,.done-mask,.completion-modal', app).some((node) => {
    const style = getComputedStyle(node);
    return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) > 0 && node.getBoundingClientRect().width > 0;
  });

  let lastRecord = "";
  const recordObservation = (action) => {
    renderLiveData();
    const values = collectObservations().slice(0, 3).map((entry) => `${entry.label} ${entry.value}`).join("；");
    const text = values || action || "完成一次场景操作";
    if (text === lastRecord) return;
    lastRecord = text;
    shellState.records.push({ time: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" }), text });
    renderRecords();
    if (dataDock.classList.contains("collapsed")) shellState.unseen += 1;
    updateBadges();
  };

  let liveRenderScheduled = false;
  const observer = new MutationObserver((mutations) => {
    if (mutations.every((mutation) => isBridgeNode(mutation.target)) || liveRenderScheduled) return;
    liveRenderScheduled = true;
    clock.nativeSetTimeout(() => {
      liveRenderScheduled = false;
      renderLiveData();
      if (completionIsVisible()) {
        if (shellState.autoPlaying) finishDemo("演示完成");
        else if (!shellState.freeMode) setStatus("已完成");
      }

  });

    if (!isBridgeNode(event.target)) clock.nativeSetTimeout(() => recordObservation("调整参数"), 120);
  }, true);
  app.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button || isBridgeNode(button) || button.closest('.modal,.modal-mask')) return;
    const text = (button.textContent || "完成操作").replace(/\s+/g, " ").trim();
    clock.nativeSetTimeout(() => recordObservation(text), 220);
  }, true);

  const cursor = document.createElement("div");
  cursor.className = "codex-auto-cursor";
  stage.append(cursor);
  const moveCursorTo = async (element, token) => {
    if (!element || token !== shellState.autoToken) return;
    const stageRect = stage.getBoundingClientRect();
    const rect = element.getBoundingClientRect();
    cursor.style.left = `${rect.left - stageRect.left + rect.width / 2}px`;
    cursor.style.top = `${rect.top - stageRect.top + rect.height / 2}px`;
    cursor.classList.add("show");
    await nativeDelay(520);
    cursor.classList.remove("tap");
    void cursor.offsetWidth;
    cursor.classList.add("tap");
  };

  const genericDemo = async (token) => {
    const sceneButtons = $$('button', stage).filter((button) => !isBridgeNode(button) && !button.disabled && button.offsetParent !== null && !button.closest('.modal,.modal-mask'));
    const ranges = $$('input[type="range"]', stage).filter((input) => !isBridgeNode(input));
    const sequence = [...ranges.slice(0, 2), ...sceneButtons.slice(0, 3)];
    if (!sequence.length) {
      setStatus("请观察场景变化");
      await nativeDelay(2600);
      return;
    }
    for (const control of sequence) {
      if (token !== shellState.autoToken || !shellState.autoPlaying) return;
      await moveCursorTo(control, token);
      if (control instanceof HTMLInputElement) {
        const min = Number(control.min || 0);
        const max = Number(control.max || 100);
        control.value = String(min + (max - min) * .72);
        control.dispatchEvent(new Event("input", { bubbles: true }));
        control.dispatchEvent(new Event("change", { bubbles: true }));
      } else safeClick(control);
      await nativeDelay(900);
    }
  };

  const finishDemo = (message = "演示完成") => {
    if (!shellState.autoPlaying) return;
    shellState.autoPlaying = false;
    shellState.autoPaused = false;
    cursor.classList.remove("show", "tap");
    if (clock.paused) clock.resume();
    syncMode();
    setStatus(message);
    recordObservation(message);
  };

  const startDemo = async () => {
    if (shellState.autoPlaying || shellState.freeMode) return;
    shellState.autoPlaying = true;
    shellState.autoPaused = false;
    shellState.autoToken += 1;
    const token = shellState.autoToken;
    setDrawerCollapsed(controlDock, false);
    setStatus("演示中");
    syncMode();
    try {
      if (legacy.auto) {
        await moveCursorTo(legacy.auto, token);
        safeClick(legacy.auto);
        await nativeDelay(12000);
      } else {
        await genericDemo(token);
      }
      if (token === shellState.autoToken) finishDemo();
    } catch (error) {
      console.error("[科普演示] 自动演示执行失败", error);
      if (token === shellState.autoToken) finishDemo("演示已停止");
    }
  };

  const exitDemo = () => {
    shellState.autoToken += 1;
    if (clock.paused) clock.resume();
    shellState.autoPlaying = false;
    shellState.autoPaused = false;
    cursor.classList.remove("show", "tap");
    safeClick(legacy.reset);
    syncMode();
    setStatus("已退出演示");
  };

  resetButton.addEventListener("click", () => {
    if (shellState.autoPlaying) {
      shellState.autoPaused = !shellState.autoPaused;
      if (shellState.autoPaused) clock.pause();
      else clock.resume();
      setStatus(shellState.autoPaused ? "演示已暂停" : "演示中");
      syncMode();
      return;
    }
    safeClick(legacy.reset);
    shellState.records = [];
    shellState.unseen = 0;
    lastRecord = "";
    renderRecords();
    renderLiveData();
    updateBadges();
    setStatus(shellState.freeMode ? "自由探索中" : "待操作");
  });
  autoButton.addEventListener("click", () => shellState.autoPlaying ? exitDemo() : startDemo());
  freeButton.addEventListener("click", () => {
    if (shellState.autoPlaying) return;
    shellState.freeMode = !shellState.freeMode;
    if (legacy.free) safeClick(legacy.free);
    if (!shellState.freeMode) safeClick(legacy.reset);
    setStatus(shellState.freeMode ? "自由探索中" : "待操作");
    syncMode();
  });

  const normalizeTaskLanguage = () => {
    $$(".task-step", app).forEach((node) => { node.textContent = node.textContent.replace(/步骤/g, "关卡"); });
  };
  normalizeTaskLanguage();
  setDrawerCollapsed(controlDock, true);
  setDrawerCollapsed(dataDock, true);
  renderLiveData();
  renderRecords();
  syncMode();
  clock.nativeSetTimeout(() => window.dispatchEvent(new Event("resize")), 80);
  window.addEventListener("resize", () => {
    if (matchMedia("(max-width: 720px)").matches) {
      [controlDock, dataDock].forEach((drawer) => {
        drawer.style.left = "";
        drawer.style.top = "";
        drawer.style.right = "";
      });
    }
  });
})();
</script>

</main>
